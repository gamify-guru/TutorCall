/* TutorCall additions */
.ttc-reset{color:#8e98ad;font-size:11px;font-weight:600;border:1px solid #ffffff1f;border-radius:999px;padding:4px 11px;background:#ffffff08;transition:color .16s,border-color .16s}
.ttc-reset:hover{color:#e5c77f;border-color:#d9b76c66}
.case-input.ttc-wrong{border-color:#c97979b3;box-shadow:0 0 0 3px #c9797926}
.ttc-times{display:grid;gap:16px}
@media (min-width:768px){.ttc-times{grid-template-columns:1fr 1fr;column-gap:24px}}
.ttc-time-row{min-width:0}
.case-input.ttc-area{max-width:none;min-height:190px;padding:12px 14px;font-family:DM Sans,sans-serif;font-size:15px;line-height:1.6;resize:vertical;display:block}
.ttc-msgs{margin:6px 0 0;padding-left:18px;list-style:disc}
.ttc-msgs li+li{margin-top:3px}
.ttc-good{margin-top:12px;display:grid;gap:4px;color:#cdb67a;font-size:12px}
.ttc-story-section{background:linear-gradient(180deg,#070b14,#0a1020);border-top:1px solid #d9b76c1f;border-bottom:1px solid #ffffff0d}
.ttc-story-grid{display:grid;gap:16px}
@media (min-width:900px){.ttc-story-grid{grid-template-columns:1.25fr 1fr}}
.ttc-story-card{background:linear-gradient(145deg,#141c2efa,#0e1524fa);border:1px solid #d9b76c2e;border-radius:15px;padding:20px;box-shadow:0 14px 35px #00000029;min-width:0}
@media (min-width:640px){.ttc-story-card{padding:24px 26px}}
.ttc-gloss{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.ttc-gloss li{font-size:11.5px;color:#aab3c4;background:#ffffff08;border:1px solid #ffffff14;border-radius:999px;padding:3px 10px}
.ttc-gloss b{color:#e5c77f;font-weight:600}
.ttc-story-card .bg-\[\#d9b76c\]\/\[0\.06\]{background:#d9b76c0f}
.max-w-4xl{max-width:56rem}
.ttc-story-card .px-3{padding-left:.75rem;padding-right:.75rem}
.ttc-story-card .py-2{padding-top:.5rem;padding-bottom:.5rem}
.ttc-story-section .py-10{padding-top:2.5rem;padding-bottom:2.5rem}
.scroll-mt-20{scroll-margin-top:5rem}
@media (min-width:40rem){.ttc-story-card .sm\:text-2xl{font-size:1.5rem;line-height:2rem}}
.text-\[\#9aa4b8\]{color:#9aa4b8}.text-\[\#c3c9d6\]{color:#c3c9d6}.text-\[\#d8c79f\]{color:#d8c79f}
.tracking-\[0\.14em\]{letter-spacing:.14em}
