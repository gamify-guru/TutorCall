function ttcSame(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function ttcDeck(key, ids, correctIds){
  const ok=Array.isArray(TTC.s[key])&&TTC.s[key].length===ids.length&&ids.every(id=>TTC.s[key].includes(id));
  if(ok&&!ttcSame(TTC.s[key],correctIds))return TTC.s[key];
  let deck=ids.slice();
  let guard=0;
  do{ttcShuffleInPlace(deck);guard++}while(ttcSame(deck,correctIds)&&guard<40);
  if(ttcSame(deck,correctIds)&&deck.length>1){[deck[0],deck[1]]=[deck[1],deck[0]]}
  TTC.s[key]=deck.slice();ttcSave();return TTC.s[key];
}

const Ds=[{id:"pastperfect",title:"Past Perfect",tag:"had + V3",ru:"Действие закончилось ДО другого прошлого момента. Формула: had + третья форма глагола.",examples:["By September she had already signed up for three clubs.","She fell behind because she had put off her reading.","When the test started, she had not read the cases."],contrast:"Не путай с Past Simple: «She signed up» — просто прошлое. «She had signed up» — это случилось РАНЬШЕ другого прошлого."},{id:"first",title:"First Conditional",tag:"реальный план",ru:"Реальный план на будущее. Формула: If + Present Simple, … will + глагол.",examples:["If she catches up on the cases, she will get through the test.","If you miss one more class, you will fall behind."],contrast:"Не путай со Second Conditional: если план реальный — Present + will. «If I will…» — так не говорим!"},{id:"second",title:"Second Conditional",tag:"другой мир",ru:"Воображаемая ситуация, «другой мир». Формула: If + Past Simple, … would + глагол.",examples:["If she took up fewer clubs, she would fit in better.","If I were you, I would talk to the tutor."],contrast:"Не путай с First Conditional: «другой мир» = Past + would. Реальный план = Present + will."},{id:"wish",title:"I wish",tag:"сожаление",ru:"Сожаление, а не план. О прошлом: I wish + had (not) + V3. О настоящем: I wish + Past / could.",examples:["I wish she hadn't put off the reading. (жаль о прошлом)","I wish she could fit in with the group. (жаль сейчас)"],contrast:"Не путай с планом: «I wish» — это НЕ «я хочу сделать». Это «мне жаль, что так». Никакого will после wish!"},{id:"modals",title:"Modals Desk",tag:"6 модальных",ru:"Стол модальных глаголов. Выбирай по смыслу: совет, обязанность, запрет, предупреждение, возможность, разрешение.",examples:[],contrast:"Главные ловушки: must ≠ had better (обязанность ≠ предупреждение), mustn't ≠ don't have to (запрет ≠ «не обязательно»).",table:[{modal:"should",meaning:"совет / мнение",example:"You should talk to your tutor."},{modal:"must",mea et through","catch up on","sign up for","Past Perfect","I wish"],prompts:[{ru:"1) Что уже случилось к началу семестра (2 × Past Perfect + look back on)",en:"When I look back on September… By October she had… because she had…"},{ru:"2) В чём проблема сейчас (phrasal verbs)",en:"Now she needs to catch up on… She almost fell behind…"},{ru:"3) Что ей must / had better / can / mustn't",en:"She must… She had better… She can… She mustn't…"},{ru:"4) Реальный план (First Conditional) + одно сожаление (I wish)",en:"If she…, she will get through… I wish she hadn't…"}],model:"When I look back on September, I see a hard start. By October the client had missed four seminars. She fell behind because she had put off her reading. Now she needs to catch up on twenty cases. She must attend every seminar. She had better not put off the next essay. She can sign up for one club only. She mustn't miss the exam registration. If she catches up on the cases this week, she will get through the January test. I wish she hadn't put off the reading, but now we have a plan."},B:{title:"Change the load",subtitle:"Снять лишнее и вписаться",ru:"Клиентка не бросает колледж, но убирает лишнюю нагрузку и ищет, как стать своей.",tools:["should","might","Second Conditional","I wish","take up","fit in","drop out of (как «не делать»)","Past Perfect"],prompts:[{ru:"1) Что уже случилось к началу семестра (2 × Past Perfect + look back on)",en:"When I look back on autumn… By September she had taken up… She was tired because she had…"},{ru:"2) В чём проблема сейчас (phrasal verbs; drop out of — как «НЕ делать»)",en:"She should not drop out of college… She wants to fit in…"},{ru:"3) Что ей should / might / can",en:"She should… She might… She can…"},{ru:"4) Другой мир (Second Conditional) + сожаление (I wish)",en:"If she took up fewer clubs, she would… I wish she…"}],model:"When I look back on this autumn, I see a tired student. By September she had taken up three clubs. She was tired because she had studied all night before every deadline. She should not drop out of college — that is not the answer. She should take up only one activity. She might feel better if the load is smaller. She can ask the clinic for help, and we will work out a plan. If she took up fewer clubs, she would fit in better with her study group. I wish she hadn't signed up for everything at once. I wish she could see how strong she is."}},um=[{id:"pp",labelRu:"2 × Past Perfect",hintRu:"Добавь строку о том, что случилось РАНЬШЕ: «By October she had…»"},{id:"phr",labelRu:"4 phrasal verbs из списка",hintRu:"Вставь глаголы из Phrasal File: catch up on, put off, fit in, get through…"},{id:"mod",labelRu:"3 разных модальных",hintRu:"Добавь совет/обязанность/предупреждение: should, must, had better, can, might…"},{id:"c1",labelRu:"1 × First Conditional",hintRu:"Реальный план: «If she + Present, she will…»"},{id:"c2w",labelRu:"1 × Second Conditional или I wish",hintRu:"Другой мир или сожаление: «If she took…, she would…» / «I wish she hadn't…»"},{id:"len",labelRu:"8–12 предложений",hintRu:"Монолог на 60–90 секунд: 8–12 полных предложений."}],rb=[{stage:"Вход и роль (3 мин)",notes:["Скажите: «Ты не ученица сегодня. Ты — Junior Case Officer. Папка почти пустая, без точных формулировок дело не примут».","Покажите обложку и папку с 5 ячейками. Договоритесь: слабая фраза в папку не идёт — это не штраф, а брак в документе.","Напомните про «Карточки правил»: открывать можно в любой момент, это не подсказка-стыд, это стол юриста."]},{stage:"Этап 1 · Timeline Desk (7 мин)",notes:["Просите ПРОИЗНОСИТЬ каждое собранное предложение вслух, не только собирать чипы.","Если время «сплющено» в Past Simple — верните карточку одной меткой: «Это не принято в Timeline. Что было РАНЬШЕ?»","Не объясняйте правило заново — пусть откроет карточку Past Perfect сама, если нужно."]},{stage:"Этап 2 · Evidence Hunt (10 мин)",notes:["Не принимайте голое «put off = откладывать». Только полная фраза в контексте клиентки.","После её варианта покажите модельный ответ и попросите сравнить: что у неё сильнее/слабее.","Если время жмёт — 7 улик в письме, 3 доберите в мини-диалоге устно."]},{stage:"Этап 3 · Rules & Advice Desk (8 мин)",notes:["Играйте декана и подругу голосом — коротко, без театра на минуту.","Главное: после выбора спросите «почему НЕ …?» (ложный близнец). Ответ «просто чувствую» не принимается.","Ловушки держите одной строкой: must ≠ had better, mustn't ≠ don't have to."]},{stage:"Этап 4 · Two Futures Brief (8 мин)",notes:["Держите два «цвета» в голосе: PLAN A — деловой тон, PLAN B — мечтательный.","Путаница 1 и 2 условного = файл не подписывается. Одна метка: «Это реальный план или другой мир?»","Для I wish проверяйте: это НЕ план, это сожаление. «I wish she will» — стоп-фраза."]},{stage:"Выбор пути + Этап 5 · Closing (8–10 мин)",notes:["Выбор A/B делает ученица, не вы. Финальное дело пишется по её версии.","Слушайте как старший юрист: останавливайте ТОЛЬКО если конструкция ломает смысл дела.","Если не хватает одной конструкции — точечная пересдача одной строки, не всего монолога.","Штамп FILE CLOSED — вслух и торжественно. Это финал дела, не «молодец, садись»."]},{stage:"Рефлексия (3 мин)",notes:["Три вопроса по роли, не «что понравилось».","Назовите ОДНУ сильную конструкцию дня и ОДНУ точку роста (чаще всего: I wish vs Second Conditional или had better vs should).","Сохраните папку: следующий урок можно начать как Case File 02."]}];function gm(o){var h,b,f="";if(typeof o=="string"||typeof o=="number")f+=o;else if(typeof o=="object")if(Array.isArray(o)){var g=o.length;for(h=0;h<g;h++)o[h]&&(b=gm(o[h]))&&(f&&(f+=" "),f+=b)}else for(b in o)o[b]&&(f&&(f+=" "),f+=b);return f}function db(){for(var o,h,b=0,f="",g=arguments.length;b<g;b++)(o=arguments[b])&&(h=gm(o))&&(f&&(f+=" "),f+=h);return f}const mb=(o,h)=>{const b=new Array(o.length+h.length);for(let f=0;f<o.length;f++)b[f]=o[f];for(let f=0;f<h.length;f++)b[o.length+f]=h[f];return b},hb=(o,h)=>({classGroupId:o,validator:h}),xm=(o=new Map,h=null,b
