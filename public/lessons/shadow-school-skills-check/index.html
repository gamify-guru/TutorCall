/* TutorCall additions */
.start-hero,.briefing-scene,.finale-scene,.scene-banner:before{background-color:#0a0b15}
.reset-trigger{gap:6px;white-space:nowrap}
.reset-trigger .reset-glyph{font-size:18px;line-height:1}
.footer-reset{background:none;border:1px solid #d8d3ef33;color:inherit;font:inherit;font-size:12px;letter-spacing:.04em;padding:8px 14px;border-radius:999px;cursor:pointer}
.footer-reset:hover,.footer-reset:focus-visible{border-color:#e9c27a;color:#f3dca5}
.hw-wordbook{display:grid;gap:8px;margin-top:14px}
.hw-wordbook-head,.hw-wordbook-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,.8fr) minmax(0,2fr);gap:8px;align-items:center}
.hw-wordbook-head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.hw-wordbook-num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid #d8d3ef33;font-size:12px}
.hw-wordbook-row.is-done .hw-wordbook-num{border-color:#e9c27a;color:#f3dca5}
.hw-question-builder{display:grid;gap:14px;margin-top:14px}
.hw-qrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px 10px;padding:12px;border:1px solid #d8d3ef1f;border-radius:14px}
.hw-qrow.is-done{border-color:#e9c27a66}
.hw-qnum{grid-row:span 3;font-size:12px;opacity:.7;padding-top:6px}
.hw-qchips{display:flex;flex-wrap:wrap;gap:6px}
.hw-qline{display:flex;gap:8px;align-items:center;min-width:0}
.hw-qline .answer-field{flex:1;min-width:0}
.hw-qstart{white-space:nowrap;color:#f3dca5}
.hw-qpreview{font-size:14px;opacity:.75;margin:0;overflow-wrap:anywhere}
.hw-story-plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.hw-plan-note{display:grid;gap:6px;font-size:13px}
.hw-missing{margin:10px 0 0;padding-left:18px;font-size:13px;opacity:.8}
.answer-field{max-width:100%;box-sizing:border-box}
@media(max-width:680px){
 .reset-trigger .reset-label{display:none}
 .reset-trigger{padding:0 10px}
 .hw-wordbook-head{display:none}
 .hw-wordbook-row{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr)}
 .hw-wordbook-row>input:last-child{grid-column:2/4}
 .hw-story-plan{grid-template-columns:minmax(0,1fr)}
 .hw-qrow{grid-template-columns:minmax(0,1fr)}
 .hw-qnum{grid-row:auto;padding:0}
 .lesson-footer{flex-wrap:wrap}
}
@media(max-width:430px){.header-shards{display:none}.header-actions{gap:6px}}
