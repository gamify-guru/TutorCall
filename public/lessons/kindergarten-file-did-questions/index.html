.qb{margin:0;min-width:0}
.qb-cue{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 7px;font-size:13px;color:var(--ink)}
.qb-cue i{font-style:normal;color:var(--ink-faint)}
.qb-label{width:100%;font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--rust-dark)}
.qb-chip{font-family:var(--serif);font-size:15px;border:1px dashed #a848326b;background:#fffaf0;padding:2px 8px;border-radius:2px}
.qb-ru{font-family:var(--serif);font-size:16px;line-height:1.3}
.qb-kw{width:100%;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.qb-st{font-family:var(--serif);font-size:16px;font-style:italic}
.qb-form{display:flex;gap:7px;align-items:stretch;min-width:0}
.qb-input{flex:1;min-width:0;border:1px solid var(--line);border-bottom:1px solid #3a2b1c66;background:#fffdf7;padding:8px 10px;font-family:var(--serif);font-size:16px;color:var(--ink);border-radius:2px}
.qb-input:focus{outline:2px solid #a848324d;outline-offset:1px}
.qb-tilebox{display:grid;gap:8px;min-width:0}
.qb-line{display:flex;flex-wrap:wrap;gap:5px;min-height:38px;align-items:center;padding:5px 7px;border:1px solid var(--line);border-bottom:1px solid #3a2b1c66;background:#fffdf7;border-radius:2px}
.qb-placeholder{font-size:12px;color:var(--ink-faint)}
.qb-qmark{font-family:var(--serif);font-size:17px}
.qb-bank{display:flex;flex-wrap:wrap;gap:5px}
.qb-tile{font-family:var(--serif);font-size:15px;border:1px solid #a848326b;background:#faf3e4;padding:4px 9px;border-radius:2px;color:var(--ink);transition:opacity .15s,transform .15s}
.qb-tile:disabled{opacity:.25}
.qb-tile.is-placed{background:#f3e3cf;border-color:var(--rust)}
.qb-actions{display:flex;gap:8px;align-items:center}
.qb-clear,.qb-model-btn{font-size:11px;font-weight:700;color:var(--rust-dark);text-decoration:underline;background:none;border:0;padding:4px 0}
.qb-model-btn{margin-top:4px}
.qb-hint{margin:6px 0 0;font-size:12px;color:var(--rust-dark);font-weight:600}
.qb-model{margin:6px 0 0;font-family:var(--serif);font-size:15px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.qb-model span{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--olive)}
.qb-wait{opacity:.35;border-style:dashed}
.ask-button:disabled{opacity:.4}
@media (max-width:680px){.qb-wait{display:none}.question-row{grid-template-columns:21px minmax(0,1fr) auto}}
