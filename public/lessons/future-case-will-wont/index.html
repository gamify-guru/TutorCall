<style id="tc-fix">html,body{overflow-x:hidden}
#root{overflow-x:clip}
button{touch-action:manipulation}
input,textarea{font-size:16px}
.tc-rrow{display:flex;justify-content:flex-end;margin:-8px 0 12px}
.tc-reset{white-space:nowrap;cursor:pointer;border:2px solid rgba(18,48,63,.3);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;color:#12303f;-webkit-tap-highlight-color:transparent;font-family:Nunito,system-ui,sans-serif}
.tc-reset:hover{border-color:#12303f}
.tc-cyr{margin-top:6px;font-size:13px;font-weight:700;color:#92400e;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:6px 10px;text-align:left}
.tc-ph{visibility:hidden;pointer-events:none}

@media (min-width:640px){.sm\:-right-6{right:-0.5rem!important}}
.hw-stack{display:grid;gap:24px}
.hw-intro{border-radius:22px;background:var(--color-ink);color:#fff;padding:14px 18px;font-weight:700;line-height:1.45}
.hw-stamp{display:inline-block;font-family:var(--font-type);text-transform:uppercase;letter-spacing:.14em;font-size:.85rem;color:var(--color-holo);border:2px dashed var(--color-holo);border-radius:999px;padding:3px 12px;margin-bottom:6px}
.hw-intro p{margin:0}
.hw-instr{font-weight:700;color:var(--color-ink-soft);margin:0 0 12px;line-height:1.4}
.hw-list{display:grid;gap:12px;list-style:none;padding:0;margin:0}
@media (min-width:900px){.hw-grid{grid-template-columns:1fr 1fr}}
.hw-item{border:2px solid var(--color-line);background:#fff;border-radius:22px;padding:14px 16px;min-width:0}
.hw-item.ok{border-color:rgba(35,149,106,.7)}
.hw-item.rv{border-color:var(--color-sun)}
.hw-row{display:flex;gap:10px;align-items:flex-start}
.hw-num{flex:none;width:32px;height:32px;border-radius:999px;background:var(--color-ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
.hw-item.ok .hw-num{background:var(--color-leaf)}
.hw-body{flex:1;min-width:0}
.hw-p{margin:0;font-family:var(--font-display);font-size:1.15rem;font-weight:500;color:var(--color-ink);line-height:1.4;overflow-wrap:anywhere}
.hw-bad{background:var(--color-coral-soft);border-radius:10px;padding:1px 8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hw-q{display:block;margin-bottom:4px}
.hw-ru{font-weight:600}
.hw-in-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hw-in{flex:1 1 200px;min-width:0;border:2px solid var(--color-line);border-radius:16px;padding:10px 14px;font-family:var(--font-display);font-size:1.1rem;color:var(--color-ink);background:#fff}
.hw-in:focus{outline:none;border-color:var(--color-holo-deep);box-shadow:0 0 0 4px rgba(34,199,238,.25)}
.hw-msg{margin:8px 0 0;border-radius:14px;padding:8px 12px;background:var(--color-sun-soft);color:var(--color-ink);font-weight:700;font-size:.95rem;line-height:1.35}
.hw-okbox,.hw-rvbox{margin-top:8px;border-radius:14px;padding:8px 12px;font-weight:600;font-family:var(--font-display);font-size:1.08rem;overflow-wrap:anywhere}
.hw-okbox{background:var(--color-leaf-soft);color:var(--color-leaf-deep)}
.hw-rvbox{background:var(--color-sun-soft);color:var(--color-ink)}
.hw-show{margin-top:8px;cursor:pointer;border:0;background:none;color:var(--color-holo-deep);font-weight:800;text-decoration:underline;padding:6px 0;font-size:.95rem}
.hw-key{margin:6px 0 0;font-size:.85rem;color:var(--color-violet);font-weight:800;overflow-wrap:anywhere}
.hw-ev{margin:8px 0 0;font-style:italic;color:var(--color-ink-soft);font-weight:600}
.hw-tf{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hw-btn{cursor:pointer;border:2px solid var(--color-line);background:#fff;border-radius:999px;padding:8px 18px;font-family:var(--font-display);font-weight:600;font-size:1rem;color:var(--color-ink);min-height:44px}
.hw-btn.bad{border-color:var(--color-coral);background:var(--color-coral-soft)}
.hw-btn.good{border-color:var(--color-leaf);background:var(--color-leaf-soft);color:var(--color-leaf-deep)}
.hw-btn:disabled{cursor:default}
.hw-text{background:var(--color-paper);border:2px dashed var(--color-line);border-radius:20px;padding:14px 16px;font-size:1.08rem;line-height:1.6;color:var(--color-ink);margin-bottom:8px}
.hw-text p{margin:6px 0 0}
.hw-th{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-display);font-size:1.15rem}
.hw-h3{font-family:var(--font-display);font-weight:600;font-size:1.2rem;color:var(--color-ink);margin:18px 0 10px}
.hw-tiles{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.hw-tile{width:32px;height:36px;border-radius:10px;background:var(--color-ink);color:var(--color-holo);display:flex;align-items:center;justify-content:center;font-family:var(--font-type);font-size:1.1rem}
.hw-emo{font-size:1.5rem;line-height:1.1}
.hw-match{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:10px}
.hw-col{display:grid;gap:8px;align-content:start}
.hw-card{cursor:pointer;text-align:left;border:2px solid var(--color-line);background:#fff;border-radius:16px;padding:8px 10px;min-height:58px;font-family:var(--font-display);font-size:1rem;font-weight:500;color:var(--color-ink);line-height:1.3;overflow-wrap:anywhere;transition:border-color .15s,box-shadow .15s}
.hw-card .hw-emo{display:block}
.hw-cap{display:block;font-size:.8rem;color:var(--color-ink-soft);font-weight:700;margin-top:2px}
.hw-card.sel{border-color:var(--color-holo-deep);box-shadow:0 0 0 4px rgba(34,199,238,.3)}
.hw-card.done{border-color:var(--color-leaf);background:var(--color-leaf-soft);cursor:default}
.hw-badge{text-align:center;border-radius:28px;padding:22px 18px;background:var(--color-ink);color:#fff;border:3px solid var(--color-holo);box-shadow:0 0 30px rgba(34,199,238,.5);font-weight:700}
.hw-badge p{margin:6px 0}
.hw-badge .big{font-size:3.4rem;line-height:1}
.hw-bt{font-family:var(--font-display);font-size:1.6rem;color:var(--color-holo)}
.hw-code{display:inline-block;margin-top:4px;font-family:var(--font-type);font-size:1.4rem;letter-spacing:.12em;background:var(--color-sun);color:var(--color-ink);border-radius:12px;padding:6px 14px}
.hw-lock{border:2px dashed var(--color-line);border-radius:22px;padding:14px 16px;font-weight:700;color:var(--color-ink-soft);background:rgba(255,255,255,.6)}
.hw-pill{font-family:var(--font-type);font-size:.85rem;border-radius:999px;padding:4px 10px;background:var(--color-holo-soft);color:var(--color-holo-deep);white-space:nowrap}
.hw-pill.full{background:var(--color-leaf-soft);color:var(--color-leaf-deep)}
</style>

 good, bad, good. B \u2013 will, will, won't, will, won't, won't, will, won't.","\u0412 \u043F\u0430\u0440\u0430\u0445: \u043E\u0434\u0438\u043D \u0447\u0438\u0442\u0430\u0435\u0442 \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0443, \u0434\u0440\u0443\u0433\u043E\u0439 \u043F\u0440\u043E\u0438\u0437\u043D\u043E\u0441\u0438\u0442 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u0446\u0435\u043B\u0438\u043A\u043E\u043C \u0434\u043E \u043D\u0430\u0436\u0430\u0442\u0438\u044F.","\u041F\u0440\u043E\u0432\u0435\u0440\u044C\u0442\u0435, \u0441\u0432\u044F\u0437\u044B\u0432\u0430\u044E\u0442 \u043B\u0438 \u0434\u0435\u0442\u0438 \xAB\u0445\u043E\u0440\u043E\u0448\u0430\u044F \u043D\u043E\u0432\u043E\u0441\u0442\u044C \u2192 will\xBB \u0438 \xAB\u043D\u0435\u0442 \u2192 won't\xBB. \u041F\u0440\u0438 \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E\u0441\u0442\u0438 \u0432\u0435\u0440\u043D\u0438\u0442\u0435\u0441\u044C \u043A \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0430\u043C \u{1F4D6}."]},m2:{time:"9 min",en:["Part A (drag & drop): drag will / won't into the gap. On touch screens tap the word, then tap the gap.","Part B (word order): tap the words in order. Green = right place, yellow = wrong place.","Answer key A: will, won't, will, won't, will, won't, won't, will.","Group variant: print the sentences, cut into word cards and race in teams of 3."],ru:["\u0427\u0430\u0441\u0442\u044C A (\u043F\u0435\u0440\u0435\u0442\u0430\u0441\u043A\u0438\u0432\u0430\u043D\u0438\u0435): \u043F\u0435\u0440\u0435\u0442\u0430\u0449\u0438\u0442\u0435 will / won't \u0432 \u043F\u0440\u043E\u043F\u0443\u0441\u043A. \u041D\u0430 \u0441\u0435\u043D\u0441\u043E\u0440\u043D\u043E\u043C \u044D\u043A\u0440\u0430\u043D\u0435 \u2014 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \u0441\u043B\u043E\u0432\u043E, \u0437\u0430\u0442\u0435\u043C \u043F\u0440\u043E\u043F\u0443\u0441\u043A.","\u0427\u0430\u0441\u0442\u044C B (\u043F\u043E\u0440\u044F\u0434\u043E\u043A \u0441\u043B\u043E\u0432): \u043D\u0430\u0436\u0438\u043C\u0430\u0439\u0442\u0435 \u0441\u043B\u043E\u0432\u0430 \u043F\u043E \u043F\u043E\u0440\u044F\u0434\u043A\u0443. \u0417\u0435\u043B\u0451\u043D\u044B\u0439 \u2014 \u0432\u0435\u0440\u043D\u043E\u0435 \u043C\u0435\u0441\u0442\u043E, \u0436\u0451\u043B\u0442\u044B\u0439 \u2014 \u043D\u0435\u0432\u0435\u0440\u043D\u043E\u0435.","\u041A\u043B\u044E\u0447\u0438 A: will, won't, will, won't, will, won't, won't, will.","\u0413\u0440\u0443\u043F\u043F\u043E\u0432\u043E\u0439 \u0432\u0430\u0440\u0438\u0430\u043D\u0442: \u0440\u0430\u0441\u043F\u0435\u0447\u0430\u0442\u0430\u0439\u0442\u0435 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u044F, \u0440\u0430\u0437\u0440\u0435\u0436\u044C\u0442\u0435 \u043D\u0430 \u0441\u043B\u043E\u0432\u0430 \u0438 \u0443\u0441\u0442\u0440\u043E\u0439\u0442\u0435 \u0433\u043E\u043D\u043A\u0443 \u0432 \u043A\u043E\u043C\u0430\u043D\u0434\u0430\u0445 \u043F\u043E 3."]},m3:{time:"7 min",en:["Students build questions for R-Tee, Pandy and Daisy, then answer the witnesses' questions using the case-file clue.","Key short answers: No, they won't \xB7 Yes, it will \xB7 No, it won't \xB7 No, they won't.","Pair variant: one student plays the witness and says the answer aloud. Swap roles after 4 questions.","Watch for it / they. Remind: do not repeat the verb in short answers."],ru:["\u0423\u0447\u0435\u043D\u0438\u043A\u0438 \u0441\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u044E\u0442 \u0432\u043E\u043F\u0440\u043E\u0441\u044B \u0434\u043B\u044F R-Tee, Pandy \u0438 Daisy, \u0437\u0430\u0442\u0435\u043C \u043E\u0442\u0432\u0435\u0447\u0430\u044E\u0442 \u043D\u0430 \u0432\u043E\u043F\u0440\u043E\u0441\u044B \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043B\u0435\u0439 \u043F\u043E \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0435 \u0438\u0437 \u0434\u0435\u043B\u0430.","\u041A\u0440\u0430\u0442\u043A\u0438\u0435 \u043E\u0442\u0432\u0435\u0442\u044B: No, they won't \xB7 Yes, it will \xB7 No, it won't \xB7 No, they won't.","\u0412 \u043F\u0430\u0440\u0430\u0445: \u043E\u0434\u0438\u043D \u0438\u0433\u0440\u0430\u0435\u0442 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043B\u044F \u0438 \u0433\u043E\u0432\u043E\u0440\u0438\u0442 \u043E\u0442\u0432\u0435\u0442 \u0432\u0441\u043B\u0443\u0445. \u041F\u043E\u0441\u043B\u0435 4 \u0432\u043E\u043F\u0440\u043E\u0441\u043E\u0432 \u043C\u0435\u043D\u044F\u044E\u0442\u0441\u044F.","\u0421\u043B\u0435\u0434\u0438\u0442\u0435 \u0437\u0430 it / they. \u041D\u0430\u043F\u043E\u043C\u043D\u0438\u0442\u0435: \u0432 \u043A\u0440\u0430\u0442\u043A\u0438\u0445 \u043E\u0442\u0432\u0435\u0442\u0430\u0445 \u0433\u043B\u0430\u0433\u043E\u043B \u043D\u0435 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0435\u043C."]},m4:{time:"8 min",en:["Students choose a path: \u2600\uFE0F Optimistic or \u{1F6E1}\uFE0F Cautious. Both are correct if the grammar is correct.","Three ways to answer: type, build with word chips, or speak (voice typing in Chrome / Edge).","Aim: 6\u20138 sentences, at least 2 with will and 2 with won't. The checker is gentle and explains the mistake.","Group variant: each group member writes one topic, then they read the dossier aloud together."],ru:["\u0423\u0447\u0435\u043D\u0438\u043A\u0438 \u0432\u044B\u0431\u0438\u0440\u0430\u044E\u0442 \u043F\u0443\u0442\u044C: \u2600\uFE0F \u043E\u043F\u0442\u0438\u043C\u0438\u0441\u0442\u0438\u0447\u043D\u044B\u0439 \u0438\u043B\u0438 \u{1F6E1}\uFE0F \u043E\u0441\u0442\u043E\u0440\u043E\u0436\u043D\u044B\u0439. \u041E\u0431\u0430 \u0432\u0435\u0440\u043D\u044B, \u0435\u0441\u043B\u0438 \u0433\u0440\u0430\u043C\u043C\u0430\u0442\u0438\u043A\u0430 \u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0430\u044F.","\u0422\u0440\u0438 \u0441\u043F\u043E\u0441\u043E\u0431\u0430 \u043E\u0442\u0432\u0435\u0442\u0430: \u043D\u0430\u0431\u0440\u0430\u0442\u044C \u0442\u0435\u043A\u0441\u0442, \u0441\u043E\u0431\u0440\u0430\u0442\u044C \u0438\u0437 \u043A\u0430\u0440\u0442\u043E\u0447\u043
