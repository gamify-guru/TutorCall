:root{
  --pf-bg:#fff6e8; --pf-card:#ffffff; --pf-ink:#2a1f14; --pf-muted:#5a4633;
  --pf-accent:#ff8a3d; --pf-accent2:#355ecf; --pf-gold:#d4920a; --pf-ok:#1c8a4e;
  --pf-danger:#c45c12; --pf-line:rgba(80,50,20,.14);
  --pf-font:"Nunito",system-ui,sans-serif; --pf-display:"Fredoka","Nunito",system-ui,sans-serif;
}
.pf-course-nav{
  position:sticky; top:0; z-index:10050; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  justify-content:space-between; padding:10px 14px; background:rgba(255,249,239,.96);
  border-bottom:1px solid var(--pf-line); backdrop-filter:blur(10px); font-family:var(--pf-font); color:#2a1f14;
}
.pf-course-nav a, .pf-course-nav button{
  appearance:none; border:1px solid rgba(80,50,20,.18); background:#fff;
  color:#2a1f14; border-radius:999px; padding:7px 13px; font:800 12px/1.2 var(--pf-font);
  text-decoration:none; cursor:pointer;
}
.pf-course-nav a:hover, .pf-course-nav button:hover{ border-color:rgba(255,138,61,.55); background:#fff5eb; }
.pf-course-nav .pf-mid{ color:#5a4633; font:800 12px/1.2 var(--pf-display); }
.pf-course-nav .pf-reset{ border-color:rgba(255,120,90,.45); background:#fff5f0; color:#8a2e16; }
.pf-hide-teacher, button:has(> span:only-child){}
/* Hide teacher scenario tabs */
.pf-hide-story-btn{ display:none!important; }

<body>
<div id="root"></div>
<script>window.PF_EPISODE = {"num": 2, "title": "Переполох Лесных Фей", "subtitle": "Forest Fairies · Vowel teams EE/EA/OO/AI/AY/OA/OU/OI", "cover": "../images/ep2-fairies.jpg", "avatar": "../images/hero-ref.jpg"};</script>
<script>
(function(){
  const meta=window.PF_EPISODE||{};
  function mountHero(){
    if(document.querySelector('.pf-ep-hero')) return;
    const hero=document.createElement('div');
    hero.className='pf-ep-hero';
    hero.innerHTML=`<img src="${meta.cover||''}" alt="${meta.title||''}" width="1280" height="720"/>
      <div class="pf-ep-caption">
        <img class="pf-avatar" src="${meta.avatar||'../images/hero-ref.jpg'}" alt="Pathfinder" width="64" height="64"/>
        <div class="pf-bubble"><h1>Эпизод ${meta.num||''}: ${meta.title||''}</h1><p>${meta.subtitle||''}</p></div>
      </div>`;
    const nav=document.querySelector('.pf-course-nav');
    const root=document.getElementById('root');
    if(nav&&nav.parentNode) nav.insertAdjacentElement('afterend', hero);
    else if(root) root.insertAdjacentElement('beforebegin', hero);
    else document.body.prepend(hero);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mountHero);
  else mountHero();
})();
</script>
<script>window.PF_LESSON = {"key": "tutorcall-pathfinder-phonics-forest-fairies-v1", "num": 2, "title": "Переполох Лесных Фей", "home": "../", "prev": "../explorers-backpack/", "next": "../dragon-gorge/"};</script>
<script>
(function(){
  const meta = window.PF_LESSON || {};
  const KEY = meta.key;
  function el(tag, attrs, kids){
    const n=document.createElement(tag);
    if(attrs) Object.entries(attrs).forEach(([k,v])=>{
      if(k==='className') n.className=v; else if(k==='text') n.textContent=v;
      else if(k.startsWith('on')&&typeof v==='function') n.addEventListener(k.slice(2).toLowerCase(),v);
      else n.setAttribute(k,v);
    });
    (kids||[]).forEach(c=>{ if(c!=null) n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return n;
  }
  function read(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||{}; }catch{ return {}; } }
  function write(patch){
    const cur={...read(), ...patch, updatedAt:Date.now()};
    try{ localStorage.setItem(KEY, JSON.stringify(cur)); }catch{}
    return cur;
  }
  function markStarted(){ const s=read(); if(!s.started) write({started:true, status:'in_progress'}); }
  function markDone(){ write({started:true, done:true, status:'done', percent:100}); }
  function resetLesson(){
    if(!confirm('Начать заново этот урок? Прогресс по эпизоду будет удалён.')) return;
    try{ localStorage.removeItem(KEY); }catch{}
    try{ if(window.PFCourse){ const sl=(location.pathname.split('/').filter(Boolean).pop()); PFCourse.resetEpisode(sl); } }catch{}
    location.reload();
  }
  function mountNav(){
    if(document.querySelector('.pf-course-nav')) return;
    const nav=el('div',{className:'pf-course-nav','data-pf-nav':'1'});
    const left=el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center'});
    left.appendChild(el('a',{href:meta.home||'../', text:'← К курсу'}));
    if(meta.prev) left.appendChild(el('a',{href:meta.prev, text:'← Пред.'}));
    if(meta.next) left.appendChild(el('a',{href:meta.next, text:'След. →'}));
    const mid=el('div',{className:'pf-mid', text:`Урок ${meta.num||'?'} из 5 · ${meta.title||''}`});
    const right=el('div',{style:'display:flex;gap:8px;flex-wrap:wrap'});
    right.appendChild(el('button',{type:'button', className:'pf-reset', text:'↺ Начать заново', onClick:resetLesson}));
    nav.append(left, mid, right);
    document.body.prepend(nav);
  }
  function hideStoryButtons(){
    document.querySelectorAll('button').forEach(btn=>{
      const t=(btn.textContent||'').trim();
      if(t==='Сценарий Урока' || t.includes('Сценарий Урока')){
        btn.classList.add('pf-hide-story-btn');
        btn.style.display='none';
      }
    });
  }
  function watchVictory(){
    const re=/ПОБЕДА|ПОКОРЕНО|ПОЗАДИ|освобождена|завершён|VICTORY|Главного Следопыта|реликвия получена/i;
    const obs=new MutationObserver(()=>{
      const text=document.body?document.body.innerText:'';
      if(re.test(text)) markDone();
      hideStoryButtons();
    });
    if(document.body) obs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  function boot(){
    mountNav();
    hideStoryButtons();
    markStarted();
    write({title: meta.title||'', num: meta.num||0});
    document.addEventListener('pointerdown', markStarted, {once:true, capture:true});
    watchVictory();
    // periodic progress pulse so home sees activity
    setInterval(()=>{
      const s=read();
      if(s.done) return;
      if(s.started) write({started:true, status:'in_progress', percent: Math.min(95, (s.percent||10)+0)});
    }, 8000);
  }
  window.PF = {read, write, resetLesson, markDone, markStarted, key: KEY};
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

      if(text.length<1) continue;
      const el=walk.currentNode.parentElement; if(!el) continue;
      const packed=opaqueBg(el); if(!packed) continue;
      const {bg}=packed;
      const L=lum(bg); if(L<0.08 || L>0.7) continue;
      const chroma=Math.max(bg.r,bg.g,bg.b)-Math.min(bg.r,bg.g,bg.b);
      if(chroma<35) continue;
      const fg=parseRGB(getComputedStyle(el).color); if(!fg) continue;
      if(contrast(fg,bg)<4.5){
        el.style.setProperty('color','#ffffff','important');
        ensureWhiteOn(packed.el, bg);
      }
    }
    root.querySelectorAll('[class*="bg-black/"]').forEach(el=>{
      el.style.setProperty('background-color', 'rgba(42,31,20,.62)', 'important');
      el.style.setProperty('color', '#ffffff', 'important');
    });
  }
  function run(){ const r=document.getElementById('root')||document.body; if(r) try{fix(r);}catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', ()=>setTimeout(run,60));
  else setTimeout(run,60);
  setTimeout(run,450); setTimeout(run,1300);
  document.addEventListener('DOMContentLoaded',()=>{
    const r=document.getElementById('root'); if(!r) return;
    const obs=new MutationObserver(()=>{ clearTimeout(run._t); run._t=setTimeout(run,240); });
    obs.observe(r,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
  });
})();
</script>
