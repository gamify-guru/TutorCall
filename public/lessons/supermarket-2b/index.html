const TABS=[['words','🛒 Слова'],['dialog','💬 Диалог'],['grammar','💡 Правила'],['tasks','✏️ Задания'],['hw','🏠 Домашка'],['final','🏆 Итог']];
function vcard(v,compact){return '<div class="vc"><div class="em">'+v.em+'</div><div class="en">'+esc(v.en)+'</div><div class="ipa">'+esc(v.ipa)+'</div><div class="ru">'+esc(v.ru)+'</div>'+(v.sec?'<div class="sec">📍 Обычно в отделе: '+esc(v.sec)+'</div>':'')+'<div class="ex">“'+esc(v.ex)+'”</div><div class="exru">'+esc(v.exru||'')+'</div><div class="btns"><button class="say" data-a="saytxt" data-v="'+esc(v.en)+'" aria-label="Слушать '+esc(v.en)+'">🔊 слово</button><button class="say" data-a="saytxt" data-v="'+esc(v.ex)+'">🔊 пример</button></div></div>'}
function pageWords(){const list=V.filter(v=>S.vcat==='all'||v.cat===S.vcat);
 return '<h2>🛒 Новые слова</h2><p>Нажимай 🔊 — слушай британское произношение. Эти слова всегда под рукой в кнопке «📖 Словарь».</p><div class="card"><b>Контейнеры и порции (partitives)</b> — так мы считаем то, что нельзя посчитать: <i>a loaf of bread</i>, <i>a bottle of cola</i>. Образец из учебника: <i>We can usually find a loaf of bread in the bakery section.</i></div><div class="chips">'+CATS.map(c=>'<button class="chip'+(S.vcat===c[0]?' on':'')+'" data-a="vcat" data-v="'+c[0]+'">'+c[1]+'</button>').join('')+'</div><div class="grid">'+list.map(v=>vcard(v)).join('')+'</div>'}
function hlText(t){if(!S.hl)return esc(t);return esc(t).replace(/\b(a few|some|any|only a little|a little|much)\b/g,'<mark>$1</mark>')}
function pageDialog(){return '<h2>💬 Диалог: Maksim и Mrs Hall</h2><div class="card">Максим — школьник на каникулах в Великобритании. Сегодня у него <b>день рождения</b>, и мама его <b>принимающей семьи</b> (<i>host family</i>) идёт с ним в супермаркет за продуктами для праздника. <b>Вопрос: что случилось (What is the problem)?</b> Прочитай диалог, а потом ответь в «Заданиях» (задание 3).</div>'+
 '<div class="chips"><button class="btn" data-a="playd">▶ Слушать весь диалог</button><button class="btn w" data-a="stop">⏹ Стоп</button><button class="btn w" data-a="toggleru">'+(S.showRu?'🙈 Скрыть перевод':'🇷🇺 Показать перевод')+'</button><button class="btn w" data-a="togglehl">'+(S.hl?'Убрать подсветку':'🖍 Подсветить many/much/some…')+'</button></div>'+
 '<div class="'+(S.showRu?'showru':'')+'" id="dlgbox">'+DLG.map((l,i)=>'<div class="dl"><div class="who '+l[0]+'">'+(l[0]==='h'?'Mrs Hall':'Maksim')+'</div><div class="t" data-a="linetr" data-i="'+i+'">'+hlText(l[1])+' <button class="say" data-a="saytxt" data-v="'+esc(l[1])+'" data-p="'+l[0]+'" aria-label="Слушать реплику">🔊</button><div class="ru">'+esc(l[2])+'</div></div></div>').join('')+'</div>'+
 '<p class="small">Подсказка: нажми на реплику, чтобы показать перевод только её.</p>'+
 '<h3>Check these words (слова из учебника)</h3><div class="grid">'+V.filter(v=>v.cat==='check').map(vcard).join('')+'</div>'+
 '<h3>Ищем количественные слова (Ex.3: find more examples)</h3><div class="card">'+QWORDS.map(q=>'<div class="line"><mark>'+esc(q[0])+'</mark> — '+esc(q[1])+'</div>').join('')+'<div class="tip">Заметь: <b>a few cartons / a few tubs</b> — счётные во мн. числе. <b>a little ice cream, much money</b> — неисчисляемые.</div></div>'}
function gramHTML(short){return '<h3>1. Счётные и неисчисляемые</h3><p><b>Countable</b> — счётные: можно посчитать: <i>one sweet, two sweets</i>, <i>an egg, ten eggs</i>. <b>Uncountable</b> — неисчисляемые: «масса», которую не считаем по штукам: <i>milk, sugar, bread, cheese, butter, flour, rice, juice, money</i>. Мы не говорим «two milks» — у них нет мн. числа.</p>'+
 '<h3>2. How many? / How much?</h3><p><b>How many</b> + счётное во мн. числе: <i>How many sweets are there?</i><br><b>How much</b> + неисчисляемое: <i>How much milk is there?</i></p>'+
 '<h3>3. Таблица слов количества</h3><table class="q"><tr><th>Слово</th><th>Счётные (sweets)</th><th>Неисчисляемые (milk)</th></tr>'+
 '<tr><td>too many / too much<br><span class="small">слишком много</span></td><td>There are <b>too many</b> sweets.</td><td>There is <b>too much</b> milk.</td></tr>'+
 '<tr><td>a lot of / lots of<br><span class="small">много (в утверждении)</span></td><td>There are <b>a lot of</b> sweets.</td><td>There is <b>a lot of</b> milk.</td></tr>'+
 '<tr><td>some / a few / a little<br><span class="small">немного, есть</span></td><td>There are <b>some / a few</b> sweets.</td><td>There is <b>some / a little</b> milk.</td></tr>'+
 '<tr><td>(very) few / (very) little<br><span class="small">мало, почти нет</span></td><td>There are (very) <b>few</b> sweets.<br>There aren’t <b>many</b> sweets.</td><td>There is (very) <b>little</b> milk.<br>There isn’t <b>much</b> milk.</td></tr>'+
 '<tr><td>any<br><span class="small">вопрос и отрицание</span></td><td>Are there <b>any</b> sweets?<br>There aren’t <b>any</b> sweets.</td><td>Is there <b>any</b> milk?<br>There isn’t <b>any</b> milk.</td></tr>'+
 '<tr><td>no<br><span class="small">нет совсем</span></td><td>There are <b>no</b> sweets.</td><td>There is <b>no</b> milk.</td></tr></table>'+
 '<div class="tip"><b>many / much</b> чаще всего в вопросах и отрицаниях: <i>How much…? I don’t have much money.</i> В обычном утверждении вместо них говорим <b>a lot of</b>: <i>I have a lot of money.</i> (А <i>too much / too many</i> — можно и в утверждении.)</div>'+
 '<h3>4. few и a few, little и a little</h3><div class="card"><p><b>a few</b> (счётные) / <b>a little</b> (неисчисляемые) = <b>немного, но хватит</b> (спокойно, нейтрально): <i>I have a few friends.</i> <i>There is a little milk.</i></p><p><b>few</b> / <b>little</b> (без «a») = <b>мало, почти нет</b> (звучит как «не хватает»): <i>I have very few friends.</i> <i>There is very little milk.</i></p><p>Запомни: <b>few → countable</b> (few eggs), <b>little → uncountable</b> (little milk).</p></div>'+
 '<h3>5. some / any / no</h3><div class="card"><p><b>some</b> — в утверждениях и предложениях/просьбах: <i>There are some apples. Would you like some tea?</i></p><p><b>any</b> — в вопросах и отрицаниях: <i>Are there any apples? There aren’t any apples.</i></p><p><b>no</b> = «not any», но глагол остаётся <b>утвердительным</b>: <i>There are no apples.</i> = <i>There aren’t any apples.</i> (Нельзя: <s>There aren’t no apples</s>.)</p></div>'+
 '<h3>6. Контейнеры и порции (partitives)</h3><div class="card"><p>Неисчисляемое нельзя считать, поэтому считаем <b>упаковки</b>: <i>a loaf of bread → two loaves of bread</i>; <i>a bottle of cola → three bottles of cola</i>. Слово после <b>of</b> остаётся неисчисляемым (bread, cola), а контейнер становится счётным: <i>a few bottles of cola</i>, <i>a lot of cartons of juice</i>.</p><p>Контейнеры: bag (crisps), tin (soup), loaf (bread), jar (jam), pot (yogurt), carton (juice), box (cereal), tub (ice cream), bottle (cola), kilo (minced beef), bunch (bananas), bar (chocolate).</p></div>'}
function pageGrammar(){return '<h2>💡 Правила: Quantifiers (слова количества)</h2>'+gramHTML()}
function pageTasks(){const done=LESSON.filter(i=>T(i).done).length;return '<h2>✏️ Задания</h2><div class="card">Выполнено: <b>'+done+' / '+LESSON.length+'</b> · ⭐ '+totalStars(LESSON)+' / '+LESSON.length*3+'. Задание можно повторять сколько угодно — звёзды остаются лучшие.</div>'+LESSON.map(i=>'<div id="task-'+i+'"></div>').join('')}
function pageHW(){const done=HW.filter(i=>T(i).done).length;return '<h2>🏠 Домашнее задание</h2><div class="card">Выполнено: <b>'+done+' / '+HW.length+'</b> · ⭐ '+totalStars(HW)+' / '+HW.length*3+'. В домашке — другие форматы: надо <b>вписывать слова сами</b>, собирать предложения и искать ошибки. Если запутался — открой «💡 Правило».</div>'+HW.map(i=>'<div id="task-'+i+'"></div>').join('')}
function pageFinal(){const dl=LESSON.filter(i=>T(i).done).length,dh=HW.filter(i=>T(i).done).length;const st=totalStars(LESSON),sh=totalStars(HW);
 let h='<h2>🏆 Итог</h2>';
 if(dl<LESSON.length)h+='<div class="card">Осталось заданий в уроке: <b>'+(LESSON.length-dl)+'</b>. Выполни все задания — и получишь сертификат! 🌟</div>';
 else h+='<div class="cert"><div class="big">🏅</div><h2>Supermarket Master!</h2><p>Ты выполнил(а) все задания урока <b>At the supermarket (2b)</b>.</p><p style="font-size:24px">⭐ '+st+' / '+LESSON.length*3+'</p><p>Теперь ты знаешь контейнеры, отделы супермаркета и many / much / a few / a little / some / any / no!</p></div>';
 h+='<div class="card"><h3>Звёзды по заданиям</h3>'+LESSON.map(i=>'<div class="hs"><span>'+esc(TASKS[i].t)+'</span><span>'+(T(i).done?stars(T(i).best):'—')+'</span></div>').join('')+'</div><div class="card"><h3>Домашка</h3>'+HW.map(i=>'<div class="hs"><span>'+esc(TASKS[i].t)+'</span><span>'+(T(i).done?stars(T(i).best):'—')+'</span></div>').join('')+'<p>Домашка: '+dh+' / '+HW.length+' · ⭐ '+sh+' / '+HW.length*3+'</p></div>';
 return h}
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>').join('')}
function renderStat(){const all=[...LESSON,...HW];const s=totalStars(all);const d=all.filter(i=>T(i).done).length;$('#starPill').textContent='⭐ '+s;$('#prog').style.width=Math.round(d/all.length*100)+'%'}
function renderMain(){renderTabs();const t=S.tab;const f={words:pageWords,dialog:pageDialog,grammar:pageGrammar,tasks:pageTasks,hw:pageHW,final:pageFinal}[t];$('#main').innerHTML=f();if(t==='tasks')LESSON.forEach(renderTask);if(t==='hw')HW.forEach(renderTask);renderStat()}
function refreshTask(id){renderTask(id);renderStat()}
/* ===== modals ===== */
let lastFocus=null;
function openModal(kind){lastFocus=document.activeElement;let h='';
 if(kind==='dict'){h='<h2>📖 Словарь</h2><input class="tx" id="dq" type="text" inputmode="search" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Поиск: english или по-русски" aria-label="Поиск по словарю"><div id="dres" style="margin-top:8px"></div>'}
 else h='<h2>💡 Правило (шпаргалка)</h2>'+gramHTML();
 $('#modal').innerHTML='<div class="ov" data-a="closeov"><div class="box" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Закрыть">✕</button>'+h+'</div></div>';document.body.style.overflow='hidden';if(kind==='dict')dictFill('')}
function closeModal(){$('#modal').innerHTML='';document.body.style.overflow='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
function dictFill(q){const n=q.trim().toLowerCase();const l=V.filter(v=>!n||v.en.toLowerCase().includes(n)||v.ru.toLowerCase().includes(n));$('#dres').innerHTML=l.length?l.map(v=>'<div class="hs" style="align-items:center"><span><span style="font-size:22px">'+v.em+'</span> <b>'+esc(v.en)+'</b> <span class="small">'+esc(v.ipa)+'</span><br>'+esc(v.ru)+'</span><button class="say" data-a="saytxt" data-v="'+esc(v.en)+'" aria-label="Слушать '+esc(v.en)+'">🔊</button></div>').join(''):'<p>Ничего не найдено.</p>'}
/* ===== events ===== */
let lastTap=0;
function doCheck(id){const d=TASKS[id],st=T(id);if(st.checked)return;let score=0,total=d.items.length;d.items.forEach((it,i)=>{if(d.kind==='match'){if(st.a[i]!=null&&d.right[st.a[i]]===it[0])score++;return}if(d.kind==='sort'){if(st.a[i]!=null&&it[2].includes(st.a[i]))score++;return}if(!itemDone(it,st.a[i]))return;if(itemOK(it,st.a[i]))score++});st.checked=true;st.score=score;st.done=true;st.best=Math.max(st.best,starsFor(score,total));save();refreshTask(id)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,id=el.dataset.t,i=el.dataset.i!=null?+el.dataset.i:null,v=el.dataset.v;
 if(a==='close'){closeModal();return}if(a==='closeov'){if(e.target===el)closeModal();return}
 if(a==='open'){openModal(v);return}
 if(a==='tab'){S.tab=v;save();renderMain();window.scrollTo(0,0);return}
 if(a==='vcat'){S.vcat=v;save();renderMain();return}
 if(a==='saytxt'){say(v,{pitch:el.dataset.p==='h'?1.15:el.dataset.p==='m'?.85:1});return}
 if(a==='stop'){stopSpeech();return}
 if(a==='play'){playSeq(LISTEN);return}
 if(a==='playd'){playSeq(DLG.map(l=>[l[0],l[1].replace(/…/g,'...')]));return}
 if(a==='showscript'){S.showScript=!S.showScript;save();refreshTask('L7');return}
 if(a==='toggleru'){S.showRu=!S.showRu;save();renderMain();return}
 if(a==='togglehl'){S.hl=!S.hl;save();renderMain();return}
 if(a==='linetr'){if(e.target.closest('button'))return;el.classList.toggle('open');return}
 if(a==='sayitem'){const it=TASKS[id].items[i];let gi=0;const txt=it.lines.map(l=>l.slice(1).map(p=>typeof p==='string'?p:p.o[p.a[0]]).join('')).join(' ');say(txt);return}
 if(!id||!TASKS[id])return;const d=TASKS[id],st=T(id);
 if(['tadd','tdel','mleft','mright','sitem','sbin','tclear'].includes(a)){const n=Date.now();if(n-lastTap<260)return;lastTap=n}
 if(a==='mute'){return}
 if(a==='retry'){st.a={};st.checked=false;st.sel=null;save();refreshTask(id);return}
 if(a==='check'){doCheck(id);return}
 if(st.checked)return;
 if(a==='opt'||a==='tick'){st.a[i]=a==='tick'?v==='1':+v;save();refreshTask(id);return}
 if(a==='gap'){const arr=Array.isArray(st.a[i])?st.a[i].slice():[];arr[+el.dataset.g]=+v;st.a[i]=arr;save();refreshTask(id);return}
 if(a==='tadd'){const arr=Array.isArray(st.a[i])?st.a[i].slice():[];if(arr.includes(+v))return;arr.push(+v);st.a[i]=arr;save();refreshTask(id);return}
 if(a==='tdel'){const arr=(st.a[i]||[]).filter(x=>x!==+v);st.a[i]=arr;save();refreshTask(id);return}
 if(a==='tclear'){st.a[i]=[];save();refreshTask(id);return}
 if(a==='mleft'){const cur=st.a[i];if(st.sel===i){st.sel=null}else{st.sel=i}save();refreshTask(id);return}
 if(a==='mright'){const j=i;const owner=Object.keys(st.a).find(k=>st.a[k]===j);if(st.sel!=null){if(owner!=null)delete st.a[owner];st.a[st.sel]=j;st.sel=null}else if(owner!=null){delete st.a[owner]}save();refreshTask(id);return}
 if(a==='sitem'){if(st.a[i]!=null){if(st.sel!=null&&st.sel!==i){st.a[st.sel]=st.a[i];st.sel=null}else{delete st.a[i];st.sel=i}}else st.sel=(st.sel===i?null:i);save();refreshTask(id);return}
 if(a==='sbin'){if(st.sel!=null){st.a[st.sel]=el.dataset.b;st.sel=null;save();refreshTask(id)}return}
 if(a==='wcheck'){const r=analyse(st.text||'');st.res={sents:r.sents.length,withQ:r.withQ,out:r.out};const ok=r.sents.length>=5&&r.withQ===r.sents.length;const good=ok&&r.okc===r.sents.length;st.score=good?3:ok?2:r.sents.length>=3&&r.withQ>=3?1:0;st.done=st.score>=2||st.done;st.best=Math.max(st.best,st.score);save();refreshTask(id);return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.a==='typed'){const st=T(el.dataset.t);st.a[+el.dataset.i]=el.value;save();const b=document.querySelector('#task-'+el.dataset.t+' [data-a=check]');if(b){const d=TASKS[el.dataset.t];const left=d.items.filter((it,i)=>!itemDone(it,st.a[i])).length;b.disabled=left>0;const sp=b.parentNode.querySelector('.small');if(sp)sp.textContent=left?'Осталось ответить: '+left:'';if(sp&&!left)sp.remove()}}
 else if(el.dataset.a==='write'){const st=T(el.dataset.t);st.text=el.value;save()}
 else if(el.id==='dq'){dictFill(el.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').firstChild){closeModal();return}
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='typed'){e.preventDefault();const all=[...document.querySelectorAll('#task-'+e.target.dataset.t+' input[data-a=typed]')];const k=all.indexOf(e.target);if(all[k+1])all[k+1].focus();else e.target.blur()}
 if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click()}});
$('#muteBtn').addEventListener('click',()=>{S.mute=!S.mute;save();setMute();if(S.mute)stopSpeech();else toast('Звук включён')});
try{if(haveSpeech())speechSynthesis.getVoices()}catch(e){}
Object.keys(TASKS).forEach(k=>TASKS[k]._id=k);
setMute();renderMain();
