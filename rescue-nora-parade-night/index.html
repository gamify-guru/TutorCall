}</style><style id="tc-fix">
.tcn-in{width:100%;min-width:0;border:2px solid #e8d5b5;border-radius:12px;background:#fff;padding:8px 10px;font-size:15px;font-weight:600;color:#1a140d;outline:none}
.tcn-in:focus{border-color:#14100a}
.tcn-in.bad{border-color:#e57a6a;background:#fde2dc}
.tcn-in.tcn-ro{background:transparent;border-color:transparent}
.tcn-row{border:1px solid #e8d5b5;background:#fff;border-radius:16px;padding:10px 12px;color:#1a140d;overflow-wrap:anywhere}
.tcn-row.ok{background:#14100a;color:#fff2d9;border-color:#14100a}
.tcn-row.bad{border-color:#e57a6a;background:#fde2dc;animation:tcnsh .4s}
.tcn-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px;font-weight:600}
.tcn-line .tcn-in{width:auto;flex:1 1 150px;max-width:260px}
.tcn-fix{background:#ff9e3d;color:#0b1026;border-radius:8px;padding:1px 8px}
.tcn-verb{color:#8a7a5e;font-weight:700}
.tcn-row.ok .tcn-verb,.tcn-row.ok .tcn-hintline{color:#ffbe62}
.tcn-btn{border:2px solid #e8d5b5;background:#fff7e9;color:#1a140d;border-radius:12px;padding:7px 12px;font-weight:700;font-size:14px;line-height:1.25;transition:transform .15s}
.tcn-btn:hover{transform:translateY(-2px)}
.tcn-btn.sel{background:#14100a;color:#ffd9a0;border-color:#14100a}
.tcn-btn.ok{background:#14100a;color:#ffd9a0;border-color:#ff9e3d}
.tcn-btn.bad{background:#fde2dc;border-color:#e57a6a;animation:tcnsh .4s}
.tcn-wide{width:100%;text-align:left}
.tcn-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcn-col{display:grid;gap:8px;align-content:start;min-width:0}
.tcn-pool,.tcn-line2,.tcn-toks,.tcn-chips,.tcn-tfbtns,.tcn-fixrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcn-pool{margin:6px 0;min-height:36px}
.tcn-line2{min-height:44px;border:2px dashed #d9c29a;border-radius:12px;padding:6px;background:#fff7e9}
.tcn-buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tcn-bucket{border:2px dashed #c9a86a;border-radius:16px;padding:10px;text-align:left;background:#fffaf0;min-height:92px;display:flex;flex-direction:column;gap:8px;color:#1a140d;min-width:0}
.tcn-bucket.armed{border-color:#ff7a1a;background:#fff0d3}
.tcn-chip{background:#14100a;color:#ffd9a0;border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px}
.tcn-tok{border:2px solid #e8d5b5;background:#fff7e9;color:#1a140d;border-radius:10px;padding:5px 9px;font-weight:700;font-size:14px}
.tcn-tok.wrongmark{background:#fde2dc;border-color:#e57a6a;text-decoration:line-through}
.tcn-tok.bad{animation:tcnsh .4s;background:#fde2dc}
.tcn-tok:disabled{opacity:1}
.tcn-hintline{font-size:12px;font-weight:700;color:#8a7a5e;display:block;margin-top:6px}
.tcn-err{color:#b3261e}
.tcn-stmt{font-size:15px;font-weight:700;margin-bottom:6px}
.tcn-say{border:0;border-radius:50%;width:36px;height:36px;background:#ff9e3d;font-size:16px;flex:none;margin-bottom:4px}
.tcn-full{display:block;color:#8a7a5e;font-weight:700;font-size:12px}
.tcn-link{background:none;border:0;text-decoration:underline;font-size:12px;font-weight:700;color:#7a5a2a;margin-top:6px}
.tcn-fixrow .tcn-in{flex:1 1 150px;width:auto}
@keyframes tcnsh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){.tcn-two,.tcn-buckets{gap:6px}.tcn-bucket{padding:8px}.tcn-btn,.tcn-tok{font-size:13px;padding:6px 8px}.tcn-line .tcn-in{max-width:none}}
html,body{overflow-x:hidden;max-width:100%}#root{min-width:0;max-width:100%}img{max-width:100%}
.flip-face button{pointer-events:auto}
@media (max-width:640px){#root h1,#root h2,#root h3,#root h4,#root p,#root li{overflow-wrap:anywhere}#root section>div{min-width:0}body{padding-bottom:24px}}
@media (max-width:480px){header>div{gap:6px!important;padding-left:8px!important;padding-right:8px!important}header>div>button:first-child>span:first-child{width:34px!important;height:34px!important}header>div>div.flex.md\:hidden>div{width:26px!important;height:26px!important;font-size:11px!important}header nav{gap:4px!important}header nav button{padding:7px 9px!important;font-size:11px!important}header nav button svg{display:none}}</style></head>
