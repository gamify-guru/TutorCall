/* Chapter 4 Dubious Shadow */
.ch4-block .button-gold,.ch4-hero .button-gold,.ch4-block .button.button-gold{
  color:#1a1408!important;background:#e8cc7a!important;border-color:#5a3d14!important;
}
.ch4-block .button-gold:not(:disabled):hover,.ch4-hero .button-gold:not(:disabled):hover{
  color:#1a1408!important;background:#f0d790!important;
}
.ch4-block .button-ink,.ch4-block .button.button-ink{
  color:#f8f0dc!important;background:#16110c!important;border-color:#c9b077!important;
}
.ch4-block .button-ink:hover{
  color:#fff8e8!important;background:#000!important;
}
.ch4-block .button-outline,.ch4-hero .button-outline{
  color:#f0e2bf!important;border-color:#d4b56a!important;background:transparent!important;
}
.ch4-num,.ch4-clock{color:#2a1a0a!important}
.ch4-block button:disabled,.ch4-hero button:disabled,.ch4-block .button:disabled,.ch4-hero .button:disabled{
  opacity:1!important;
  color:#1a1408!important;
  background:#d7c89a!important;
  border-color:#6a542c!important;
  box-shadow:none!important;
}
.ch4-block .button-ink:disabled{
  color:#f8f0dc!important;
  background:#2a2218!important;
  border-color:#8a7344!important;
}

.ch4-hero{min-height:680px}
.ch4-hero-image{object-position:center 22%;filter:saturate(.9)brightness(.82)}
.ch4-shade{background:linear-gradient(90deg,#07060af5,#120e0ce8 28%,#140f0cb0 58%,#140f0c40 80%,#08101720),linear-gradient(#05030866,#0000 20% 58%,#0d0a0855 86%,#0d0a08)}
.ch4-block{padding:48px 0 24px;color:var(--parchment,#e8dcc4)}
.ch4-block h2,.ch4-block h3,.ch4-block h4{font-family:Cinzel,serif;color:#e3c88f;margin:0 0 12px}
.ch4-block>p,.ch4-lead,.ch4-block li{color:#d8cbb3;line-height:1.65}
.ch4-story{padding:28px 28px 32px;margin:16px 0 24px;max-width:720px}
.ch4-line{margin:0 0 .55em;color:#2a2118;font-size:1.12rem;line-height:1.55}
.ch4-line-d{padding-left:1em}
.ch4-vocab{padding:16px 20px;margin:0 0 24px;max-width:720px;color:#2a2118}
.ch4-vocab summary{cursor:pointer;font-weight:700;color:#3a2a18}
.ch4-vocab-list{margin:12px 0 0;padding:0 0 0 18px}
.ch4-vocab-list li{margin:0 0 8px;color:#2a2118}
.ch4-vocab-list em{display:block;color:#4a3728;font-size:.95em}
.ch4-tasks{display:grid;gap:14px;margin:16px 0}
.ch4-card{padding:16px 18px;color:#2a2118}
.ch4-q{margin:0 0 10px;font-weight:650;color:#2a2118}
.ch4-card label,.ch4-card p,.ch4-hw,.ch4-hw p,.ch4-hw li,.ch4-hw legend,.ch4-recs,.ch4-timer,.ch4-rec{color:#2a2118}
.ch4-chars,.vocab-options{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #8a7048;background:#f4ead4;color:#2a2118;border-radius:999px;padding:8px 14px;font-weight:700;min-height:44px}
.chip.is-on{background:#5c3d16;color:#f8edd7;border-color:#3a2710}
.ch4-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 8px}
.status-line.ok,.ok{color:#146c38;font-weight:700}
.status-line.err,.err{color:#8a1c1c;font-weight:700}
.ch4-order{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.ch4-order-item{display:flex;align-items:center;gap:12px;padding:10px 12px;color:#2a2118}
.ch4-num{flex:0 0 2em;font-weight:800;color:#5c3d16}
.ch4-move{margin-left:auto;display:flex;gap:4px}
.ch4-lock{padding:20px;margin:18px 0;color:#2a2118;max-width:720px}
.ch4-hidden{padding:16px 18px;margin-top:20px;color:#2a2118}
.ch4-journal{width:100%;min-height:64px;border:1px dashed #7a6238;background:#efe2c4;color:#2a2118;font-weight:800;border-radius:12px;padding:12px}
.ch4-journal.is-found{background:#d8f0c8;border-style:solid}
.ch4-hw{padding:20px 20px 24px;margin:18px 0;color:#2a2118}
.ch4-ege{border:0;margin:0 0 16px;padding:0}
.ch4-ege legend{font-weight:800;margin-bottom:8px;color:#2a2118}
.ch4-opt{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;padding:8px 10px;border-radius:10px;cursor:pointer;color:#2a2118}
.ch4-opt input{margin-top:5px;accent-color:#5c3d16}
.ch4-opt.is-picked{background:#efe2c4}
.ch4-opt.is-right{background:#d8f0c8;outline:2px solid #146c38}
.ch4-opt.is-wrong{background:#f8d4d0;outline:2px solid #8a1c1c}
.ch4-ills{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
@media(max-width:700px){.ch4-ills{grid-template-columns:1fr}}
.ch4-ills figure{margin:0;background:#1a1410;padding:8px;border:1px solid #baa37255}
.ch4-ills img{width:100%;height:auto;display:block;background:#111}
.ch4-ills figcaption{color:#e8dcc4;font-size:13px;padding:8px 4px 2px;text-align:center}
.ch4-timers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(max-width:700px){.ch4-timers{grid-template-columns:1fr}}
.ch4-timer,.ch4-rec{padding:14px 16px;margin:12px 0}
.ch4-clock{font-family:Cinzel,serif;font-size:2rem;font-weight:700;color:#5c3d16;margin:0 0 8px}
.ch4-mic-msg{color:#6a3a10;font-weight:700}
.ch4-hw textarea,.ch4-card textarea{width:100%;border:1px solid #8a7048;border-radius:10px;padding:10px 12px;min-height:70px;background:#fffdf8;color:#2a2118;font:inherit}
.ch4-block .hint{color:#4a3728}
@media print{
  #ttc-wm-bar,.ttc-wm-layer,.ttc-wm-badge{display:flex!important;opacity:1!important;visibility:visible!important;position:fixed!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body:not([data-print=ch4homework]) .ch4-hero,body:not([data-print=ch4homework]) .ch4-block{display:none!important}
  body[data-print=ch4homework] .ch4-hero,body[data-print=ch4homework] .ch4-timers,body[data-print=ch4homework] .ch4-rec,body[data-print=ch4homework] .ch4-actions,body[data-print=ch4homework] .ch4-journal,body[data-print=ch4homework] .site-header,body[data-print=ch4homework] .site-footer{display:none!important}
  body[data-print=ch4homework] .ch4-block,body[data-print=ch4homework] .ch4-hw,body[data-print=ch4homework] .ch4-ills,body[data-print=ch4homework] .ch4-story,body[data-print=ch4homework] .homework-writing{display:block!important;color:#111!important;background:#fff!important}
  body[data-print=ch4homework] img{filter:none!important;max-width:100%}
}


/* n52: watermark bar clearance + chapter-lock banners */
html,body{min-height:100%;height:auto}
body{padding-bottom:56px}
.ttc-ch-lock{margin:20px auto 40px;max-width:760px}
.container:has(> .ttc-ch-lock) > :not(.ttc-ch-lock){display:none!important}
section:has(> .ttc-ch-lock) > :not(.ttc-ch-lock){display:none!important}
@media (max-width:520px){body{padding-bottom:64px}}

,"Connects seemingly unrelated clues"],matchStrength:"Exceptional memory and an analytical mind",fear:"Failing the people who rely on her",secret:"Knows something about the night in the archive",quote:"Details don't lie. People do.",clue:"She sees patterns before others notice them.",lastSeen:"Ravenhill Library, Upper Archives · October 12, 9:47 PM"},{id:"alex",name:"Alex Ramirez",age:16,file:"RP-07-ALX",role:"The Musician",color:"#bf8d5b",description:"A rebellious guitarist with a kind heart. Music is how he makes sense of the noise.",biography:["Alex Ramirez is a 16-year-old musician who loves playing the guitar. He is part of a local band and dreams of becoming famous one day. Alex has a rebellious side and often clashes with authority figures, but deep down, he is kind and loyal.","Music has always been a part of his life. As a child, he would sing along to songs played at home. Over time, he discovered his talent for guitar and began performing with his band. Being on stage makes him feel alive.","Despite his passion, Alex sometimes gets into trouble. However, those who know him understand that his behavior is simply his way of expressing himself."],strengths:["Deeply empathetic","A creative problem solver","Calm when music is involved","Brings people together"],matchStrength:"Brings people together through music",fear:"That his music will never matter",secret:"Wrote a song about the night of the disappearances",quote:"Some songs aren't meant to be heard.",clue:"Some sounds at Ravenhill are not just sounds.",lastSeen:"Ravenhill Auditorium · October 12, 10:41 PM"},{id:"maya",name:"Maya Patel",age:16,file:"RP-07-MP",role:"The Artist",color:"#b8a05b",description:"Creative, independent, and not afraid to be different. Her sketchbook holds a secret.",biography:["Maya Patel is a 16-year-old girl with a passion for art. She loves drawing and painting, often spending hours working on her creations. Maya is creative, independent, and not afraid to be different.","She tends to be disorganized and sometimes forgets important things, but she is aware of this and tries to improve. Maya believes that life is about taking risks and following your dreams.","In the archive, her sketchbook is filled with symbols she cannot explain. Curious and intuitive, she notices what others miss and questions everything. She feels responsible for things beyond her control."],strengths:["An original imagination","Notices overlooked details","Asks unexpected questions","Thinks beyond the rules"],matchStrength:"An artistic eye for overlooked details",fear:"Being forgotten and losing the people she loves",secret:"Recognizes the hidden symbols but is being silenced",quote:"The truth isn't always loud.",clue:"Maya notices what others ignore.",lastSeen:"Ravenhill Academy, Main Hall · October 12, 9:47 PM"},{id:"ethan",name:"Ethan Li",age:16,file:"RP-05-ET",role:"The Navigator",color:"#7f9b87",description:"Logical, observant, and always three steps ahead. Every mystery has coordinates.",biography:["Ethan Li is a 16-year-old student known for his intelligence and powers of observation. He loves solving puzzles, studying maps, and finding patterns that other people cannot see.","Calm under pressure, Ethan prefers logic to impulsive decisions. He has an excellent sense of direction and carries a star-chart notebook and a vintage compass wherever he goes.",'Ethan once found coordinates that did not exist on any known map. When asked how, he said, "Some places only show up if you know where to look." He has been preparing for this moment long before the case began.'],strengths:["Spatial thinking","Decodes complex patterns","An excellent sense of direction","Stays analytical under pressure"],matchStrength:"Decodes complex patterns and reads maps",fear:"Not finding the right way before time runs out",secret:"Found uncharted coordinates before the invitations",quote:"The map is never wrong. People are.",clue:"The map may change when Ethan looks at it.",lastSeen:"Ravenh е тайны на виду",goal:"Разбудить интерес и снять страх перед английским текстом.",steps:["Откройте обложку главы на экране. Не читайте плашки — дайте ученикам 20 секунд разглядывать картинку.","Задайте три вопроса: “Who is watching us? Where are these people? What is hidden in this picture?”","Соберите 4–5 коротких ответов, не исправляя ошибки. Запишите на доске слова, которые пригодятся: secret, clue, gate, night."],script:"You are investigators tonight. Ravenhill keeps six places of secrets. Let’s find them.",materials:"Проектор или экран, сайт открыт на обложке."},{id:"s2",time:"00:04–00:12",minutes:8,title:"Пролог: три правила мистера Дэвиса",goal:"Чтение с общим пониманием и выделение трёх правил игры.",steps:["Откройте «Прочитать пролог» и покажите первые два абзаца.","Дайте 3 минуты на чтение в парах, задача — найти три правила и записать их по-английски короткой фразой.","Уточните у класса: “Why were these six chosen?” Ждём ответ: each is the best in some sphere or has a unique trait.","Попросите открыть вкладку «Преподаватели» и найти, кто такие Ms. Parish, Mr. Davis, Mr. Johnson (30 секунд, по желанию)."],materials:"Модальное окно «Ravenhill Academy / The beginning»."},{id:"s3",time:"00:12–00:22",minutes:10,title:"Задание 01, категория «Роли» — модель учителя",goal:"Показать алгоритм работы с досье, затем передать работу ученикам.",steps:["На большом экране откройте досье Эмили: текст «About Emily» и вкладку «Улики и секреты».","Проговорите по-английски вслух: “She prepares arguments — she notices what others overlook. So her role is The Analyst.”","Перетащите или выберите The Analyst и нажмите поле под портретом. Нажмите «Проверить ответы».","Пары заполняют остальные пять ролей, время — 5 минут. Потом один ученик читает ответ, второй показывает доказательство в досье."],script:"Read the file, not the picture. Your evidence is always a sentence.",materials:"Раздел «Личные дела», вкладки категорий 01–04."},{id:"s4",time:"00:22–00:33",minutes:11,title:"Категории «Сильные стороны», «Страхи», «Тайны»",goal:"Полная отработка лексики характера и работа со смыслом текста.",steps:["Разделите категории: первая половина класса берёт strengths, вторая — fears, затем обмениваются.","Правило: перед ответом нужно вслух прочитать английское предложение из досье.","Сборная проверка: одна пара называет героя, другая — факт, класс подтверждает кивками или просит доказательство.","Если остаётся время, разберите пары «похожих» героев: Jake или Olivia? Ethan или Emily?"],materials:"Кнопка «Подсказка» в доске расследования для слабых пар."},{id:"s5",time:"00:33–00:41",minutes:8,title:"Задание 02: первые улики отчёта",goal:"Разобрать формат второго задания и начать работу с длинным текстом.",steps:["Откройте «Сбор улик» и выберите Эмили в палитре персонажей, объясните: “One character — four clues.”","Вместе выделите первые две улики об Эмили, комментируя вслух: “facts, not intuition — that is Emily.”","Пары продолжают с любым другим героем, 3 минуты. Остальное дочитывается дома или на втором уроке.","Покажите словарь дела и попросите произнести 4 слова вслух: confidential, overlook, to rely on, under pressure."],materials:"Раздел «Сбор улик», блок «Словарь дела»."},{id:"s6",time:"00:41–00:45",minutes:4,title:"Рефлексия и объяснение домашнего задания",goal:"Закрепить результат и снять непонимание по формату ДЗ.",steps:["Задайте exit-вопрос: “Name one character and one fear. Use the phrase from the file.” Три ответа по кругу.","Откройте раздел «Домашнее задание». Разберите один пример вместе: улика → место → название.","Покажите письменную часть и список слов clue, evidence, atmosphere, seems, hidden.","Напомните про кнопку «Распечатать лист» и «Скачать отчёт» в «Моём прогрессе»."],script:"Homework: six places, one name each, and three sentences about your choice.",materials:"Раздел «Домашнее задание», кнопка печати worksheet."}]},{id:"plan90",label:"Сценарий на 90 минут / два урока",summary:"Полное прохождение главы: два задания, домашнее задание в классе, письменная работа и защита ответов.",stages:[{id:"a1",time:"Урок 1 · 00:00–00:08",minutes:8,title:"Хук и предсказание сюжета",goal:"Вход в атмосферу и активизация лексики тайны.",steps:["На обложке попросите предсказать сюжет: “Write one sentence: This story is about…”","Соберите предсказания, зафиксируйте 3 самые популярные на доске — к ним вернётесь в конце.","Введите 6 слов: clue, evidence, hidden, secret, game, participant — быстро, без перевода, через жесты и контекст."],materials:"Обложка главы, доска."},{id:"a2",time:"Урок 1 · 00:08–00:20",minutes:12,title:"Пролог и шесть досье: jigsaw reading",goal:"Чтение в формате «каждый изучает своего героя».",steps:["Разделите класс на шесть мини-групп — по одному герою на группу.","Каждая группа читает биографию, а также strengths, fear и hidden truth, и готовит 3 предложения по-английски.","Группы по очереди представляют героя классу: “Emily is seventeen. She is The Analyst. She fears…”","Пока группа говорит, остальные открывают досье и проверяют факты — это модель peer-checking."],script:"You are the expert on one character. Make the class understand who they are.",materials:"Раздел «Личные дела», досье героев."},{id:"a3",time:"Урок 1 · 00:20–00:34",minutes:14,title:"Задание 01 полностью + скрытая улика",goal:"Автоматизировать формат соответствия и развить внимание к деталям.",steps:["Все четыре категории проходятся подряд, каждая группа проверяет свой блок и получает штамп VERIFIED.","Дополнительная задача для быстрых: найти в досье зачёркнутую строку и объяснить, почему её скрыли.","Обсудите мотив: “Who could hide this warning? Is Mr. Davis the one to trust?” — 2 минуты дискуссии."],materials:"Досье Майи, блок скрытой улики в доске расследования."},{id:"a4",time:"Урок 1 · 00:34–00:45",minutes:11,title:"Сбор улик: стратегия чтения длинного текста",goal:"Научить стратегии «характер → фрагмент текста».",steps:["Объясните алгоритм: прочитать абзац → найти деталь, похожую на описание героя → выделить цветом этого героя.","Разберите первый абзац вместе: одно утверждение — один персонаж, могут быть «двойные» детали (Jake: конфликт и давление).","Пары собирают по 4 улики на двух героев, затем обмениваются персонажами с другой парой."],materials:"Раздел «Сбор улик», палитра персонажей."},{id:"b1",time:"Урок 2 · 00:00–00:08",minutes:8,title:"Повторение и разогрев",goal:"Активизировать лексику перед письмом и ДЗ.",steps:["Быстрый квиз: учитель читает факт по-английски, класс называет героя (10 фактов, 30 секунд).","Проверьте предсказания с первого урока: “Which of your predictions were right?”"],materials:"Заметки с доски, «Мой прогресс»."},{id:"b2",time:"Урок 2 · 00:08–00:24",minutes:16,title:"Сбор улик: завершение и защита ответов",goal:"Полная отработка задания 02 и развитие монолога с опорой на текст.",steps:["Пары завершают 24 улики и нажимают «Проверить улики».","Обязательное правило: каждый ответ нужно защитить предложением из текста, прочитанным вслух.","Разберите 3–4 типичные ошибки из объяснений: Maya и Emily (детали против фактов), Jake и Olivia (давление против тревоги), Alex и Ethan (эмоции против логики)."],materials:"Раздел «Сбор улик», блок «Под лупой» с объяснениями."},{id:"b3",time:"Урок 2 · 00:24–00:38",minutes:14,title:"Домашнее задание в классе: шесть мест",goal:"Отработать чтение улик и сопоставление «улика → место».",steps:["Откройте карту Ravenhill. Прочитайте вслух первую улику и подумайте вместе: “What objects and what time do we see?”","Пары сопоставляют шесть мест и защищают выбор: “The echo of a melody shows the auditorium.”","Проверьте названия и разберите блоки «Связь с главой 1» — они показывают, чьё досье ведёт к каждой точке.","Раздайте распечатанный worksheet (кнопка «Распечатать лист») для тех, кто предпочитает работать ручкой."],materials:"Карта, карточки локаций, печатный worksheet."},{id:"b4",time:"Урок 2 · 00:38–00:45",minutes:7,title:"Writing: аргумент в 3–4 предложениях",goal:"Подготовить письменную часть домашнего задания по критериям ЕГЭ.",steps:["Прочитайте вопрос и список обязательных слов на английском.","Дайте 4 минуты на черновик: тезис → аргумент с because → вывод. Напомните про времени 3–4 предложения.","Пары обмениваются черновиками и дают одну похвалу и одно улучшение.","Покажите «Модель ответа» и обсудите, чем она хороша, а чем можно улучшить."],materials:"Блок «Writing» в домашнем задании."}]}],H3=[{task:"Пролог + обложка",skill:"Прогнозирование содержания текста",ege:"Чтение 1–2, заголовки",minutes:"5–8 мин"},{task:"Задание 01, «Роли»",skill:"Search reading, умение найти одну конкретную деталь",ege:"Чтение, множественный выбор",minutes:"8–10 мин"},{task:"Сильные стороны, страхи, тайны",skill:"Лексика характера и чувств, работа с синонимами",ege:"Лексика и грамматика",minutes:"10–12 мин"},{task:"Задание 02, улики",skill:"Reading for detail, понимание анафоры и местоимений",ege:"Чтение 12–16, соответствие",minutes:"12–16 мин"},{task:"Домашнее задание, локации",skill:"Установление логических связей, догадка по контексту",ege:"Чтение, пропуски",minutes:"8–10 мин"},{task:"Writing-блок",skill:"Письменное высказывание с аргументом",ege:"Письмо, задание 38",minutes:"7–10 мин"}],sd={support:["Дайте слабой паре первые ответы верными — дальше они работают по образцу.","Разрешите пользоваться блоком «Подсказка» и словарём дела.","Разделите категории: сначала только «Роли» и «Сильные стороны», затем остальное.","Для улик заранее подсветите первый фрагмент вместе всем классом."],stretch:["Попросите объяснить, почему дистрактор похож на верный ответ.","Дайте задание придумать седьмого участника с ролью, страхом и тайной, а затем описать его в 3 предложениях.","Предложите написать продолжение: что герой сделал после исчезновения Майи.","Назначьте ученика «хранителем карты»: он ведёт класс по локациям и комментирует связи."],online:["Показывайте свой экран в течение 3 минут, затем отправляйте пары в breakout rooms.","Собирайте ответы через голосование: поднятая рука, чат или карточки A/B/C.", function ch4Norm(s){
  return String(s||"").toLowerCase().normalize("NFC")
    .replace(/[’‘`]/g,"'")
    .replace(/[“”«»]/g,'"')
    .replace(/[—–]/g,"-")
    .replace(/[^a-z0-9'"?.,\-\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function ch4Has(s, parts){
  const n=ch4Norm(s);
  return parts.every(p=>n.includes(ch4Norm(p)));
}
function ch4AnyKeys(s, groups){
  return groups.some(g=>ch4Has(s, Array.isArray(g)?g:[g]));
}
function ch4IsQuestion(s){
  const n=ch4Norm(s);
  if(!n) return false;
  if(n.includes("?")) return true;
  return /^(why|what|where|when|who|how|did|do|does|is|are|was|were|can|could|would)\b/.test(n);
}
function ch4Shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
