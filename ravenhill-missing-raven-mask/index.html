06",short:"Evidence",title:"Evidence Analysis"},{id:"contradictions",num:"07",short:"Contradictions",title:"Contradictions Panel"},{id:"gap-fill",num:"08",short:"Note",title:"Investigator's Note"},{id:"hypothesis",num:"09",short:"Hypothesis",title:"Final Hypothesis"},{id:"reflection",num:"10",short:"Reflection",title:"Reflection"}],Ul={kicker:"Case File #0027 · Grade 10 · B1–B2",title:"Ravenhill Academy",subtitle:"The Missing Raven Mask",teacherText:["Welcome to Ravenhill Academy, junior investigators. Three days before the Halloween Festival, the school's most famous treasure — the two-hundred-year-old Raven Mask — disappeared from a locked display case in the Library Archives.","Look closely at the photograph: Marcus, Sophie and Hana are studying the investigation board, where every pin, photo and piece of red string tells part of the story.","The mask was displayed at the Fall Masquerade on October 26, it was last seen in the Archives at about 8:30 PM on October 27, and it was discovered missing at 9:15 the next morning.","There is no CCTV in the Archives, so the only way to solve the case is to read carefully, compare witness statements and spot the contradictions.","In this lesson you will learn ten phrasal verbs and ten idioms, work with the timeline, analyse the evidence, and finally write your own hypothesis about who took the mask, why, and where it is now.","Keep your detective's notebook open at every stage — the smallest note might turn out to be the biggest clue."],boardNotes:[{text:"Mask last seen — Library Archives, Oct 27",tone:"yellow"},{text:"No CCTV in Archives",tone:"pink"},{text:"Who had access?",tone:"yellow"},{text:"Motive?",tone:"yellow"},{text:"Initiation ritual?",tone:"yellow"},{text:"Students interviewed",tone:"mint"}],timeline:[{date:"Oct 26",text:"Mask displayed — Fall Masquerade"},{date:"Oct 27",text:"Last seen — Library Archives, ~8:30 PM"},{date:"Oct 28",text:"Discovered missing — ~9:15 AM"},{date:"Oct 29",text:"Investigation begins"}]},dp=[{id:"show-up",front:"show up",meaning:"to arrive or appear, especially when people are expecting you",example:"Jake promised to return the spare key that evening, but he never showed up at the library."},{id:"take-off",front:"take off",meaning:"to leave suddenly or quickly (also: to remove clothes, or for a plane to leave the ground)",example:"The footsteps stopped by the archive door, and then someone took off down the back stairs."},{id:"set-up",front:"set up",meaning:"to arrange, prepare or organise something",example:"Mr. Hargreaves set up a locked display case in the Archives on the morning of October 27."},{id:"figure-out",front:"figure out",meaning:"to understand or solve something after thinking about it",example:"We still have to figure out who had access to the Archives between 8:30 and 9:20 PM."},{id:"look-into",front:"look into",meaning:"to investigate or examine something carefully",example:"The team decided to look into the black candle wax found by the archive door."},{id:"dress-up",front:"dress up",meaning:"to put on special or formal clothes, or a costume",example:"More than three hundred students dressed up for the Fall Masquerade on October 26."},{id:"get-away-with",front:"get away with",meaning:"to do something wrong and not be caught or punished for it",example:"Whoever took the Raven Mask clearly thinks they can get away with it."},{id:"come-across",front:"come across",meaning:"to find something or meet someone by chance",example:"The caretaker came across the spare key in the drama club prop room."},{id:"scare-away",front:"scare away",meaning:"to frighten someone or something so that they leave",example:"The thief may have used ghost stories to scare away curious students from the library at night."},{id:"light-up",front:"light up",meaning:"to make something bright or illuminate it (also: to suddenly become bright or happy)",example:"People say the Raven Society lights up black candles at its initiation ritual."}],fp=[{id:"cry-wolf",front:"cry wolf",meaning:"to raise a false alarm so often that people stop believing you",example:"Ethan says people cry wolf about secret rituals every Halloween, so nobody takes the rumours seriously."},{id:"ghost-town",front:"a ghost town",meaning:"a place that is completely empty and silent, with nobody around",example:"After 8:30 PM the library was a ghost town — not a single student in sight."},{id:"jump-skin",front:"jump out of one's skin",meaning:"to be suddenly and extremely frightened or surprised",example:"When Olivia heard heavy footsteps in the corridor, she nearly jumped out of her skin."},{id:"the-creeps",front:"the creeps",meaning:"an uncomfortable feeling of fear or unease (give someone the creeps)",example:"The black feather lying on the empty stage gave Jake the creeps."},{id:"pull-leg",front:"pull someone's leg",meaning:"to joke with someone by telling them something that is not true",example:"Jake thinks Ethan is just pulling everyone's leg with his secret society stories."},{id:"white-ghost",front:"(as) white as a ghost",meaning:"very pale because of fear, shock or illness",example:"Mr. Hargreaves turned white as a ghost when he saw the empty display case."},{id:"coast-clear",front:"the coast is clear",meaning:"there is no danger of being seen or caught",example:'The note in the library book said: "Wait until the coast is clear, then bring it to the tower."'},{id:"in-the-dark",front:"in the dark",meaning:"not knowing about something; not informed",example:"Until we check the logbook, we are still completely in the dark about who entered the Archives."},{id:"face-music",front:"face the music",meaning:"to accept criticism or punishment for something you have done",example:"Sooner or later the person who took the mask will have to face the music."},{id:"face-fears",front:"face one's fears",meaning:"to deal with something that frightens you instead of avoiding it",example:"The investigators had to face their fears and climb the dark stairs to the old bell tower."}],Zi=[{id:"t-masquerade",order:1,when:"Oct 26, 7:00 PM",text:"Hundreds of students dress up for the Fall Masquerade, and the Raven Mask is displayed in the Great Hall for the first time in fifty years."},{id:"t-case",order:2,when:"Oct 27, 8:00 AM",text:"The next morning, Mr. Hargreaves sets up a locked display case in the Library Archives and moves the mask there."},{id:"t-key",order:3,when:"Oct 27, 3:30 PM",text:"In the afternoon, Olivia lends the spare archive key to Jake, who wants to look into some old costumes stored in the Archives."},{id:"t-lock",order:4,when:"Oct 27, 8:30 PM",text:"At 8:30 PM Olivia checks the mask, signs the logbook and locks the archive door."},{id:"t-rain",order:5,when:"Oct 27, 8:40 PM",text:"Ten minutes later it starts raining heavily, and the courtyard turns into a ghost town."},{id:"t-footsteps",order:6,when:"Oct 27, ~9:00 PM",text:"At about nine, Olivia, who is still studying in the reading room, hears heavy footsteps in the corridor and nearly jumps out of her skin."},{id:"t-missing",order:7,when:"Oct 28, 9:15 AM",text:"The following morning Mr. Hargreaves opens the Archives, finds the empty case and turns white as a ghost."},{id:"t-propkey",order:8,when:"Oct 28, 11:00 AM",text:"Before lunch, the caretaker comes across the spare key in the drama club prop room."},{id:"t-announce",order:9,when:"Oct 28, 4:00 PM",text:"That afternoon, Headmistress Whitfield announces that whoever took the mask will have to face the music."},{id:"t-investigation",order:10,when:"Oct 29, 10:00 AM",text:"On October 29 the investigation begins: the junior investigators set up the board and start interviewing students."},{id:"t-false-cctv",order:null,when:"FALSE",text:"At 8:30 PM the CCTV cameras in the Archives light up and record a figure in a black cloak.",why:"The pink note on the board says: NO CCTV IN ARCHIVES."},{id:"t-false-date",order:null,when:"FALSE",text:"On October 26 the mask is last seen in the Library Archives.",why:"On October 26 the mask was in the Great Hall; it was last seen in the Archives on October 27."}],Tr=[{id:"jake",name:"Jake Morrison",age:16,role:"Drama Club President",alibi:"Says he was rehearsing in the theatre all evening.",image:En.jake},{id:"olivia",name:"Olivia Chen",age:16,role:"Library Assistant",alibi:"Says she locked the Archives at 8:30 PM and then studied in the reading room.",image:En.olivia},{id:"ethan",name:"Ethan Walsh",age:17,role:"Suspected Raven Society member",alibi:"Says he was in his dorm room all evening.",image:En.ethan}],yu=[{id:"w1",speaker:"jake",text:"I was in the theatre all evening on the 27th, setting up the stage for our Halloween play, and I didn't leave until ten.",target:["set up"]},{id:"w2",speaker:"olivia",text:"I lent the spare key to Jake that afternoon; he promised to bring it back, but he never showed up.",target:["show up"]},{id:"w3",speaker:"ethan",text:"I was in my dorm room all evening; my roommate Sam can confirm it.",target:[]},{id:"w4",speaker:"jake",text:"I never borrowed any archive key — the mask isn't even part of our play.",target:[]},{id:"w5",speaker:"olivia",text:"At about nine I heard heavy footsteps in the corridor and nearly jumped out of my skin.",target:["jump out of one's skin"]},{id:"w6",speaker:"ethan",text:"The Raven Society doesn't exist — every Halloween people cry wolf about secret rituals.",target:["cry wolf"]},{id:"w7",speaker:"jake",text:"Honestly, Ethan and his friends are just pulling everyone's leg with this secret society story.",target:["pull someone's leg"]},{id:"w8",speaker:"olivia",text:"I checked the Archives at 8:30 PM and the mask was still in its case — I wrote it in the logbook and locked the door.",target:[]},{id:"w9",speaker:"ethan",text:"I have never been inside the Archives — I don't even know where they are.",target:[]},{id:"w10",speaker:"jake",text:"I came across a black feather on the stage on the 29th, and it gave me the creeps.",target:["come across","the creeps"]},{id:"w11",speaker:"olivia",text:"After 8:30 the library was a ghost town — I stayed in the reading room to study, and I didn't see anybody.",target:["a ghost town"]},{id:"w12",speaker:"ethan",text:"When I heard the mask was gone, I went white as a ghost — it's a school treasure.",target:["white as a ghost"]}],Mv=[{text:"Caretaker locked the theatre at 9:00 PM on Oct 27.",tone:"yellow"},{text:"Sam Patel (Ethan's roommate) — away football match Oct 27, back Oct 28.",tone:"pink"},{text:'Archive logbook: "E. Walsh — 20 Oct — history project".',tone:"sky"},{text:"Spare key found in drama club prop room, Oct 28, 11:00 AM.",tone:"mint"},{text:"Mr. Hargreaves saw Olivia leave the library at 9:20 PM.",tone:"yellow"}],Qi=[{id:"mc1",question:"Which two statements directly contradict each other?",options:['Jake: "I never borrowed any archive key" — Olivia: "I lent the spare key to Jake"',`Jake: "Ethan is pulling everyone's leg" — Ethan: "people cry wolf about secret rituals"`,'Olivia: "the library was a ghost town" — Olivia: "I heard heavy footsteps"','Ethan: "I went white as a ghost" — Jake: "it gave me the creeps"'],answer:0,explanation:"Both statements cannot be true. The spare key was later found in the drama club prop room, which supports Olivia's version."},{id:"mc2",question:"Ethan says his roommate Sam can confirm his alibi. What does the board say?",options:["Sam was in the library with Olivia.","Sam was at an away football match and only came back on October 28.","Sam is the president of the drama club.","Sam signed the archive logbook at 8:30 PM."],answer:1,explanation:"Sam was away all evening, so nobody can confirm where Ethan was at nine o'clock."},{id:"mc3",question:"Which statement is contradicted by the archive logbook?",options:['Olivia: "I wrote it in the logbook and locked the door."',`Jake: "I didn't leave until ten."`,'Ethan: "I have never been inside the Archives."','Olivia: "I nearly jumped out of my skin."'],answer:2,explanation:'The logbook shows "E. Walsh — 20 Oct — history project", so Ethan has been inside the Archives before.'},{id:"mc4",question:"Jake says he stayed in the theatre until ten. Why is this a problem?",options:["The play was cancelled that week.","The theatre is inside the library building.","The caretaker locked the theatre at 9:00 PM.","Jake is not a member of the drama club."],answer:2,explanation:"If the theatre was locked at nine, Jake was somewhere else between nine and ten — and he is not telling us where."}],Hm={prompt:"In your opinion, which contradiction is the most serious? Explain in one or two sentences.",model:"The most serious contradiction is Ethan's alibi: he says his roommate can confirm he was in his dorm room, but Sam was away at a football match, so nobody can confirm where Ethan was at nine o'clock."},Ar=[{id:"ev-boots",label:"Exhibit 1",title:"Muddy boot prints",location:"Archive floor, next to the display case",image:En.bootprints,verdict:"useful",clues:[{id:"ev-boots-1",text:"Fresh prints show up on the archive floor — the cleaners had mopped it at 6 PM, so somebody came in later that evening.",useful:!0},{id:"ev-boots-2",text:"The sole pattern belongs to heavy outdoor boots, about size 10 — Jake and Olivia both wear trainers.",useful:!0},{id:"ev-boots-3",text:"A first-year student insists the prints were left by the ghost of the first headmaster, who 'walks the Archives every Halloween'.",useful:!1}],modelExplanation:"Useful: the prints prove that someone in heavy boots entered the Archives after 8:40 PM, when the rain started — the ghost story is just a distraction."},{id:"ev-ticket",label:"Exhibit 2",title:"Torn masquerade ticket",location:"Under the display cabinet",image:En.ticket,verdict:"red-herring",clues:[{id:"ev-ticket-1",text:"The ticket is dated October 26 — the night the mask was displayed in the Great Hall, not in the Archives.",useful:!1},{id:"ev-ticket-2",text:"More than three hundred students dressed up for the masquerade, and every one of them had a ticket exactly like this.",useful:!1},{id:"ev-ticket-3",text:"It was torn in half by an usher at the door, just like all the others — there is no name on it.",useful:!1}],modelExplanation:"Red herring: the ticket could belong to any of three hundred students and it tells us nothing about who was in the Archives on October 27."},{id:"ev-wax",label:"Exhibit 3",title:"Black candle wax",location:"By the archive door and on the bell tower stairs",image:En.wax,verdict:"useful",clues:[{id:"ev-wax-1",text:"Candles are banned in the Archives, and the electric lights were switched off all evening — so the visitor brought their own light.",useful:!0},{id:"ev-wax-2",text:"Students say the Raven Society lights up black candles at its initiation ritual on Halloween night.",useful:!0},{id:"ev-wax-3",text:"The caretaker came across the same black wax on the stairs to the old bell tower the next morning.",useful:!0}],modelExplanation:"Useful: the wax connects the Archives with the Raven Society's ritual and points to the bell tower as a possible hiding place."},{id:"ev-feather",label:"Exhibit 4",title:"Black feather",location:"Theatre stage",image:En.feather,verdict:"red-herring",clues:[{id:"ev-feather-1",text:"Jake came across the feather on the morning of the 29th and says it gave him the creeps.",useful:!1},{id:"ev-feather-2",text:"The drama club's Halloween play uses dozens of black feathers in its costumes.",useful:!1},{id:"ev-feather-3",text:"The theatre is in a different building, and the feather was found two days after the mask disappeared.",useful:!1}],modelExplanation:"Red herring: the feather almost certainly fell off a costume — it was found in the wrong building two days too late to tell us anything."}],Na=[{id:"c1",text:"Jake says he never borrowed the archive key, but Olivia says she lent it to him at 3:30 PM.",important:!0,why:"It explains how the thief could get in without breaking the lock — and shows Jake is hiding something."},{id:"c2",text:"Olivia says she locked up at 8:30, but Mr. Hargreaves saw her leave the building at 9:20.",important:!1,why:"She stayed in the reading room to study — this actually explains why she heard the footsteps."},{id:"c3",text:"Ethan says his roommate can confirm his alibi, but Sam was at an away football match that night.",important:!0,why:"Ethan's only alibi has collapsed, so nobody knows where he was at nine o'clock."},{id:"c4",text:"The festival poster says the Fall Masquerade started at 7 PM, but Jake remembers it starting at 7:30.",important:!1,why:"A half-hour difference on October 26 has nothing to do with the theft on October 27."},{id:"c5",text:"Ethan says he has never been inside the Archives, but the logbook shows his signature on October 20.",important:!0,why:"He knows exactly where the Archives are and how they work — and he lied about it."},{id:"c6",text:"Olivia says the library was a ghost town, but two first-years say they returned books at 7:45 PM.",important:!1,why:"7:45 is before Olivia locked the Archives at 8:30, so there is no real contradiction."},{id:"c7",text:"Jake says he stayed in the theatre until ten, but the caretaker locked the theatre at nine.",important:!0,why:"Jake has no alibi between nine and ten — exactly when the footsteps were heard."},{id:"c8",text:"Jake says the black feather gave him the creeps, but Olivia says Jake isn't scared of anything.",important:!1,why:"How brave Jake is doesn't help us find the mask."},{id:"c9",text:`Ethan claims the Raven Society doesn't exist, but a note signed "E." mentions a meeting at the tower on the 31st.`,important:!0,why:"The note suggests a secret meeting on Halloween — and the initial matches Ethan."},{id:"c10",text:"Headmistress Whitfield calls the mask 'priceless', but the insurance form says it is worth £2,000.",important:!1,why:"The value of the mask doesn't change who took it or where it is."},{id:"c11",text:"Mr. Hargreaves says the spare key never leaves the library office, but Olivia lent it to Jake.",important:!0,why:"A broken rule created the opportunity: for several hours the key was outside the office."},{id:"c12",text:"Ethan says he went white as a ghost when he heard the news, but a classmate says he knew about it before the announcement.",important:!0,why:"How could Ethan know the mask was missing before anyone was told?"}],Bm={prompt:"Choose one important contradiction and explain in one or two sentences why it matters for the case.",model:"Jake's statement that he never borrowed the key matters because the key was later found in the prop room: it shows how the thief got in and proves that Jake is not telling the whole truth."},hp=["dressed up","a ghost town","face the music","showed up","took off","look into","the coast is clear","jumped out of her skin","in the dark","scared away","came across","cry wolf","pulling our leg","lit up","get away with","figure out"],du={title:"Investigator's Note",stamp:"Case #0027",date:"October 29 · 11:40 PM"},Tu=[[{type:"text",text:"We are still partly "},{type:"gap",id:"g1",answer:"in the dark"},{type:"text",text:", but the picture is getting clearer. On October 26 hundreds of students "},{type:"gap",id:"g2",answer:"dressed up"},{type:"text",text:" for the Fall Masquerade, and the Raven Mask was displayed in the Great Hall. The next morning the mask was moved to a locked case in the Archives."}],[{type:"text",text:"At 8:30 PM Olivia locked the archive door. After that, the library was "},{type:"gap",id:"g3",answer:"a ghost town"},{type:"text",text:". At about nine she heard heavy footsteps in the corridor and nearly "},{type:"gap",id:"g4",answer:"jumped out of her skin"},{type:"text",text:". Jake had promised to return the spare key that evening, but he never "},{type:"gap",id:"g5",answer:"showed up"},{type:"text",text:". The following morning the caretaker "},{type:"gap",id:"g6",answer:"came across"},{type:"text",text:" the key in the drama club prop room — so the thief did not need to break in."}],[{type:"text",text:"We must "},{type:"gap",id:"g7",answer:"look into"},{type:"text",text:" the black candle wax. Somebody "},{type:"gap",id:"g8",answer:"lit up"},{type:"text",text:" a candle in a room where candles are banned, and the same wax was found on the stairs to the old bell tower. Ethan insists that people "},{type:"gap",id:"g9",answer:"cry wolf"},{type:"text",text:" about secret rituals every Halloween, but his alibi has fallen apart: his roommate was away all night."}],[{type:"text",text:"Tomorrow we will "},{type:"gap",id:"g10",answer:"figure out"},{type:"text",text:" exactly who had access between 8:30 and 9:20 PM. Whoever took the mask will not "},{type:"gap",id:"g11",answer:"get away with"},{type:"text",text:" it. Sooner or later, they will have to "},{type:"gap",id:"g12",answer:"face the music"},{type:"text",text:"."}]],mp=[{label:"show up",pattern:/\bshow(?:s|ed|ing|n)?\s+up\b/i},{label:"take off",pattern:/\bt(?:ake|akes|aking|ook|aken)\s+off\b/i},{label:"set up",pattern:/\bset(?:s|ting)?\s+up\b/i},{label:"figure out",pattern:/\bfigur(?:e|es|ed|ing)\s+(?:\w+\s+)?out\b/i},{label:"look into",pattern:/\blook(?:s|ed|ing)?\s+into\b/i},{label:"dress up",pattern:/\bdress(?:es|ed|ing)?\s+up\b/i},{label:"get away with",pattern:/\bg(?:et|ets|etting|ot|otten)\s+away\s+with\b/i},{label:"come across",pattern:/\bc(?:ome|omes|oming|ame)\s+across\b/i},{label:"scare away",pattern:/\bscar(?:e|es|ed|ing)\s+(?:\w+\s+)?away\b/i},{label:"light up",pattern:/\bli(?:ght|ghts|ghting|t)\s+(?:\w+\s+)?up\b/i},{label:"cry wolf",pattern:/\bcr(?:y|ies|ied|ying)\s+wolf\b/i},{label:"a ghost town",pattern:/\bghost\s+town\b/i},{label:"jump out of one's skin",pattern:/\bjump(?:s|ed|ing)?\s+out\s+of\s+(?:\w+\s+)?skin\b/i},{label:"the creeps",pattern:/\bthe\s+creeps\b/i},{label:"pull someone's leg",pattern:/\bpull(?:s|ed|ing)?\s+(?:\w+['\u2019]?s?\s+)?leg\b/i},{label:"white as a ghost",pattern:/\bwhite\s+as\s+a\s+ghost\b/i},{label:"the coast is clear",pattern:/\bcoast\s+(?:is|was|will\s+be|would\s+be|['\u2019]s)\s+clear\b/i},{label:"in the dark",pattern:/\bin\s+the\s+dark\b/i},{label:"face the music",pattern:/\bfac(?:e|es|ed|ing)\s+the\s+music\b/i},{label:"face one's fears",pattern:/\bfac(?:e|es|ed|ing)\s+(?:\w+\s+)?fears?\b/i}],kn={prompt:"Who took the Raven Mask, why, and where is it now?",instructions:"Write a short hypothesis of 6–8 sentences. Use the evidence, the timeline and the contradictions you have found. You must use at least three phrasal verbs or idioms from this lesson.",criteria:["6–8 complete sentences","Names a suspect (WHO)","Explains the motive (WHY)","Suggests a location (WHERE)","Uses at least 3 phrasal verbs / idioms from the lesson","Refers to at least two pieces of evidence or contradictions"],model:"I believe Ethan Walsh took the Raven Mask. He needed it for the Raven Society's initiation ritual on Halloween night, which explains the black candle wax in the Archives. On October 27 he came across the spare key in the drama club prop room after Jake left it there. At about nine o'clock, when the coast was clear, he entered the Archives — those were the footsteps that made Olivia jump out of her skin. His alibi fell apart because his roommate was away at a football match. Ethan tried to keep everyone in the dark by saying that people were crying wolf about the society. The mask is probably hidden in the old bell tower, where the caretaker found the same candle wax. Sooner or later Ethan will have to face the music."},wu=[{id:"r1",question:"Which phrasal verb or idiom was the most useful for understanding the case? Why?",placeholder:"For me, the most useful expression was … because …"},{id:"r2",question:"What was the biggest contradiction on the board?",placeholder:"The biggest contradiction was … It mattered because …"}],Yi={overview:["Level: B1–B2 (CEFR), Grade 10. Format: individual online work, 90 minutes (or two 45-minute lessons: Stages 1–5 and Stages 6–10).","Aims: (1) introduce and practise 10 phrasal verbs and 10 Halloween-themed idioms; (2) develop reading for detail and critical thinking (ordering, contradictions, red herrings); (3) produce a short argumentative text (hypothesis) using the target language.","Everything the student types (answers, notes, hypothesis, reflection) is saved automatically in the browser, so the lesson can be paused and continued later. The Notebook button collects notes from every stage and can be downloaded as a text file."],procedure:[{stage:"1 · The Case (5 min)",note:"Students read the teacher text and the board notes. Elicit: What do we know? What don't we know? Draw attention to NO CCTV and WHO HAD ACCESS."},{stage:"2–3 · Cards (15 min)",note:"Students flip each card, read the meaning and the case example. Encourage them to write a personal example in their notes. Cards can be shuffled for self-testing."},{stage:"4 · Timeline (10 min)",note:"Students first spot the two FALSE statements (mark with ✗), then order the ten true events. Mobile users can use the arrow buttons instead of dragging."},{stage:"5 · Witnesses (15 min)",note:"Three steps: Who said it? → Which sentences contain target language? → MCQs on contradictions. Finish with the short written answer."},{stage:"6 · Evidence (10 min)",note:"Each clue is marked Useful / Red herring. Stress that one piece of evidence can contain a useless detail (Exhibit 1, clue 3)."},{stage:"7 · Contradictions (10 min)",note:"Drag-and-drop sorting. The key question: 'Does this change WHO, WHY or WHERE?' If not, it is not important."},{stage:"8 · Investigator's Note (10 min)",note:"Gap-fill with a 16-item word bank (12 answers + 4 distractors). Stronger students: cover the bank and try first."},{stage:"9 · Hypothesis (15 min)",note:"The success-criteria checklist updates live. Show the model answer only after students have written their own version."},{stage:"10 · Reflection (5 min)",note:"Short personal responses. These can be submitted to the teacher by downloading the notebook."}],solution:"Ethan Walsh took the mask for the Raven Society's Halloween initiation. Jake borrowed the spare key in the afternoon and carelessly left it in the drama club prop room (he lied because he was afraid to face the music about losing it). Ethan found the key there at about 8:50 PM, entered the Archives at nine (the footsteps Olivia heard), used a black candle instead of the lights, and hid the mask in the old bell tower, where the same wax was found. Olivia is innocent; her 'contradiction' is explained by the time she spent in the reading room.",differentiation:["Support: allow students to keep the card sets open while doing Tasks 4–8; reduce the hypothesis to 5 sentences and 2 target expressions.","Challenge: ask students to write a second paragraph defending a different suspect, or to add one new piece of evidence that would prove their hypothesis.","Pair/group variation: assign one witness to each student and hold a 'press conference' before the hypothesis is written."],rubric:[{criterion:"Content (who / why / where)",points:"4"},{criterion:"Use of evidence and contradictions",points:"3"},{criterion:"Target language (≥ 3 expressions, used correctly)",points:"3"},{criterion:"Accuracy and cohesion",points:"2"}]},Yl="ravenhill:v1:";function Gi(i,r){return pp(i,r)}function pp(i,r){if(typeof window>"u")return r;try{const v=window.__TC.get(i);return v===void 0||!window.__tcValid(i,v,r)?r:v}catch{return r}}function tt(i,r){const[u,o]=k.useState(()=>{const d=typeof r=="function"?r():r,v=pp(i,d);return window.__tcValid(i,v,d)?v:d});(k.useLayoutEffect||k.useEffect)(()=>{window.__TC.set(i,u)},[i,u]);const h=k.useCallback(()=>{o(typeof r=="function"?r():r);window.__TC.del(i)},[i,r]);return[u,o,h]}function zv(){const i={};try{for(const k in window.__TC.m)if(k.indexOf("notes:")===0){const v=window.__TC.get(k);typeof v==="string"&&(i[k.slice(6)]=v)}}catch{}return i}function Dv(){window.__TC.clear()}const fu=["phrasal-verbs","idioms","timeline","witnesses","evidence","contradictions","gap-fill","hypothesis","reflection"],gp=k.createContext(null)
