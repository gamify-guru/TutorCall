<style>
@font-face{font-family:'RubikE';src:url(fonts/RubikE.woff2) format('woff2');font-weight:300 900;font-display:swap}
@font-face{font-family:'NunitoE';src:url(fonts/NunitoE.woff2) format('woff2');font-weight:200 1000;font-display:swap}
:root{
  --y:rgb(240,205,70);--m:rgb(140,196,150);--p:rgb(112,62,128);--l:rgb(220,200,235);
  --d:rgb(40,28,48);--bg:#fbf7ee;--card:#fff;--muted:#6d6176;
  --T:'RubikE','Rubik','Arial Black',system-ui,sans-serif;
  --B:'NunitoE','Nunito','Segoe UI',system-ui,sans-serif;
  --bar:56px;
  --stripe:repeating-linear-gradient(135deg,var(--y) 0 52px,var(--m) 52px 104px,var(--p) 104px 156px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;height:auto}
body{font-family:var(--B);color:var(--d);background:var(--bg);font-size:17px;line-height:1.4;padding-bottom:var(--bar)}
header{background:var(--stripe);padding:14px 16px}
.hwrap{background:#fff;border-radius:20px;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 6px 18px rgba(40,28,48,.18)}
.logo{font-family:var(--T);font-weight:800;background:var(--p);color:#fff;border-radius:16px;padding:8px 14px;font-size:18px;letter-spacing:.4px}
h1{font-family:var(--T);font-weight:800;margin:0;font-size:clamp(22px,2.4vw,32px);flex:1}
.sub{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:15px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--T);font-weight:800;font-size:16px;border:0;border-radius:16px;padding:11px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(40,28,48,.25);transition:transform .08s;color:var(--d);background:var(--y)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(40,28,48,.25)}
.btn.pri{background:var(--y)}
.btn.sec{background:var(--m)}
.btn.ghost{background:#f1ecf4;color:var(--p);box-shadow:none;font-size:15px;padding:9px 14px}
.btn.sm{font-size:14px;padding:8px 12px;box-shadow:0 3px 0 rgba(40,28,48,.2)}
.btn[aria-pressed=true]{background:var(--p);color:#fff}
.btn:focus-visible{outline:3px solid var(--p);outline-offset:2px}
main{padding:16px 16px 72px;max-width:1280px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:inherit;font-family:var(--T);font-weight:800;font-size:15px;border:2px solid #e6dfeb;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--d)}
.tab[aria-selected=true]{color:#fff;border-color:transparent}
.tab[data-deck="all"][aria-selected=true],.tab[data-deck="Тайна"][aria-selected=true]{background:var(--p)}
.tab[data-deck="Роль"][aria-selected=true]{background:var(--m);color:var(--d)}
.tab[data-deck="Спор"][aria-selected=true]{background:var(--y);color:var(--d)}
.tab[data-deck="Ограничение"][aria-selected=true]{background:#c9b3d8;color:var(--d)}
.status{margin-left:auto;font-weight:700;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.card{position:relative;container-type:inline-size;container-name:card;touch-action:manipulation;scroll-margin-bottom:calc(var(--bar) + 16px);scroll-margin-top:8px}
.card-sizer{visibility:hidden;pointer-events:none}
.card-sizer .front-frame{position:relative}
.card-sizer .face-front{position:relative;inset:auto;transform:none;backface-visibility:visible;-webkit-backface-visibility:visible;box-shadow:none;overflow:visible;height:auto;display:block}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.15,.2,1);border-radius:26px}
.card.is-flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 8px 22px rgba(40,28,48,.16)}
.face-front{transform:rotateY(0deg) translateZ(1px);cursor:pointer}
.face-back{transform:rotateY(180deg) translateZ(1px);display:flex;flex-direction:column;background:#fff;color:var(--d)}
/* ---- new reference front ---- */
.front-frame{background:var(--stripe);padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px;height:100%;border-radius:26px}
.illu{position:relative;border-radius:18px;overflow:hidden;background:#efe8f3;aspect-ratio:4/3;flex:0 0 auto}
.illu img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.deck-pill{position:absolute;top:12px;left:12px;z-index:2;font-family:var(--T);font-weight:800;font-size:clamp(11px,3.6cqi,15px);letter-spacing:.4px;text-transform:uppercase;background:var(--p);color:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 3px 10px rgba(40,28,48,.25);max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.played-stamp{position:absolute;top:12px;right:12px;z-index:2;background:var(--m);color:var(--d);font-family:var(--T);font-weight:800;font-size:12px;border-radius:999px;padding:4px 9px;box-shadow:0 2px 8px rgba(40,28,48,.18)}
.front-panel{background:#fff;border-radius:18px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-width:0}
.front-title{font-family:var(--T);font-weight:800;font-size:clamp(18px,6.2cqi,26px);line-height:1.15;margin:0;color:var(--d);overflow-wrap:anywhere}
.front-chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-family:var(--T);font-weight:800;font-size:clamp(11px,3.3cqi,14px);border-radius:999px;padding:5px 10px;line-height:1.15;white-space:nowrap}
.fchip.gc{background:var(--y);color:var(--d)}
.fchip.lv{background:var(--m);color:var(--d)}
.fchip.tm{background:var(--l);color:var(--p)}
.clue{background:#fff6c9;border-radius:14px;padding:8px 10px 9px}
.clue-lab{font-family:var(--T);font-weight:800;font-size:clamp(11px,3.2cqi,13px);letter-spacing:.6px;text-transform:uppercase;color:var(--p);margin:0 0 3px}
.clue p{margin:0;font-weight:800;font-size:clamp(13px,3.8cqi,16px);line-height:1.3;color:var(--d);overflow-wrap:anywhere}
.phrases-lab{font-family:var(--T);font-weight:800;font-size:clamp(11px,3.2cqi,13px);letter-spacing:.6px;text-transform:uppercase;color:var(--p);margin:2px 0 2px}
.phrases ul{margin:0;padding:0;list-style:none}
.phrases li{position:relative;padding:1px 0 1px 18px;font-weight:700;font-size:clamp(13px,3.7cqi,16px);line-height:1.3;overflow-wrap:anywhere}
.phrases li:before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--m)}
.front-foot{margin:2px 0 0;font-size:clamp(11px,3cqi,13px);font-weight:700;color:#8a8190}
.card.is-played .illu img{opacity:.92;filter:saturate(.85)}
/* ---- back (unchanged content) + timer ---- */
.back-scroll{flex:1;min-height:0;overflow:auto;padding:12px 14px 8px;-webkit-overflow-scrolling:touch}
.back-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.back-head h2{font-family:var(--T);font-weight:800;font-size:18px;margin:0;flex:1;line-height:1.2}
.badge{align-self:flex-start;font-family:var(--T);font-weight:800;font-size:12px;letter-spacing:.4px;text-transform:uppercase;border-radius:999px;padding:3px 9px;color:#fff;background:var(--p)}
.badge.роль{background:var(--m);color:var(--d)}
.badge.спор{background:var(--y);color:var(--d)}
.badge.ограничение{background:#9b7aaf;color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{font-size:12px;font-weight:800;background:#f3eef6;color:var(--p);border-radius:999px;padding:3px 8px}
.goal{font-weight:800;margin:0 0 8px;font-size:15px}
.story{margin:0 0 8px;color:var(--muted);font-size:14px;font-weight:600}
h3.sec{font-family:var(--T);font-weight:800;font-size:13px;margin:10px 0 4px;color:var(--p);text-transform:uppercase;letter-spacing:.3px}
.steps{margin:0;padding:0;list-style:none}
.steps li{margin:0 0 6px;padding:6px 8px;background:#fbf7ee;border-radius:10px;font-size:13.5px}
.steps b{font-family:var(--T);font-weight:800}
.ex{margin:0 0 4px;padding:6px 8px;background:#f3eef6;border-radius:10px}
.ex strong{display:block;font-family:var(--T);font-size:12px;margin-bottom:2px}
.ex ul{margin:0;padding-left:18px;font-size:13px}
.words{font-size:13px;color:var(--muted);font-weight:700;margin:4px 0 0}
.back-actions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px;border-top:1px solid #efe8f3;background:#fff}
.card-timer{border-top:1px solid #efe8f3;background:#fbf7ee;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:2;scroll-margin-bottom:calc(var(--bar) + 16px)}
.timer-btns .btn,.back-actions .btn{position:relative;z-index:3;pointer-events:auto}
.timer-clock{font-family:var(--T);font-weight:800;font-variant-numeric:tabular-nums;font-size:28px;line-height:1;text-align:center;color:var(--d)}
.timer-bar{height:10px;background:#e6dfeb;border-radius:999px;overflow:hidden}
.timer-bar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(135deg,var(--y) 0 14px,var(--m) 14px 28px);border-radius:999px;transform-origin:left center;transition:transform .2s linear}
.timer-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.timer-flash{animation:tflash .7s ease-in-out 3;background:#fde68a}
@keyframes tflash{50%{background:var(--y);transform:scale(1.03)}}
.card.is-done .timer-clock,.timer-done .timer-clock{color:var(--p)}
/* spotlight */
#spot{display:none;position:fixed;inset:0;background:rgba(40,28,48,.55);z-index:30;padding:52px 12px calc(var(--bar) + 12px);align-items:center;justify-content:center}
#spot.open{display:flex}
#spot .close-x{position:absolute;top:12px;right:12px;z-index:2}
.spot-stage{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(520px,100%);max-height:100%;}
#spot-card.card{width:100%;max-height:calc(100vh - var(--bar) - 200px);overflow:auto}
#spot-card.card .card-inner{min-height:100%}
#spot-card .illu{max-height:220px;aspect-ratio:16/10}
#spot-card .front-frame{gap:6px;padding:8px}
#spot-card .front-panel{padding:8px 12px 8px;gap:5px}
#spot-card .front-title{font-size:clamp(18px,4.5cqi,24px)}
.spot-stage{overflow:auto;max-height:100%}
#spot-timer.timer-lg{width:100%;background:#fff;border-radius:18px;padding:12px 14px 14px;box-shadow:0 8px 22px rgba(40,28,48,.18);flex:0 0 auto}
#spot-timer .timer-clock{font-size:clamp(42px,8vw,64px);padding:4px 0}
#spot-timer .timer-bar{height:14px}
#spot-timer .btn{font-size:16px;padding:10px 16px}
body.stage .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
body.stage header .sub{display:none}
.pulse{animation:pulse 0.9s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
footer{text-align:center;color:var(--muted);font-weight:700;padding:8px 16px 48px;font-size:15px}
footer b{color:var(--p);font-family:var(--T)}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){
  .grid{grid-template-columns:1fr;max-width:420px;margin:0 auto}
  .hwrap{gap:8px}
  h1{font-size:22px;flex:1 1 100%}
  .status{margin-left:0;width:100%}
  .btn{font-size:15px}
  .back-actions{padding-bottom:14px}
}
@media (prefers-reduced-motion:reduce){
  .card-inner{transition:none}
  .pulse,.timer-flash{animation:none}
}
</style>
</head>

const TTC_KEY = 'tutorcall-speaking-decks-v1';
const DECKS = ['Тайна','Роль','Спор','Ограничение'];

function ttcLoad(){
  try{
    const raw = localStorage.getItem(TTC_KEY);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || typeof o !== 'object') return null;
    return o;
  }catch(e){ return null; }
}
function ttcSave(){
  try{
    localStorage.setItem(TTC_KEY, JSON.stringify({
      deck: S.deck, order: S.order, flipped: [...S.flipped], played: [...S.played],
      sound: !!S.sound, savedAt: Date.now()
    }));
  }catch(e){}
}

const saved = ttcLoad() || {};
const S = {
  deck: DECKS.includes(saved.deck) || saved.deck === 'all' ? saved.deck : 'all',
  order: Array.isArray(saved.order) && saved.order.length === GAMES.length ? saved.order.slice() : GAMES.map(g => g.n),
  flipped: new Set(Array.isArray(saved.flipped) ? saved.flipped : []),

const $ = sel => document.querySelector(sel);

const byN = Object.fromEntries(GAMES.map(g => [g.n, g]));

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function deckClass(d){ return String(d).toLowerCase(); }
function frontOf(n){ return FRONT[String(n)] || FRONT[n] || {}; }
function defaultSecs(g){
  const f = frontOf(g.n);
  if(f.secs) return f.secs;
  if(g.t && g.t.length) return g.t[g.t.length-1] * 60;
  return 8 * 60;
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

function listVisible(){
  const nums = S.order.filter(n => byN[n] && (S.deck === 'all' || byN[n].deck === S.deck));
  return nums.map(n => byN[n]);
}

function timerMarkup(g, large){
  const st = timerStateFor(g.n);
  const running = Timer.n === g.n && Timer.running;
  const startLabel = running ? '⏸ Пауза' : (st.left < st.total && st.left > 0 ? '▶ Продолжить' : '⏱ Старт');
  return `<div class="card-timer${large?' timer-lg':''}${st.left===0?' timer-done':''}" data-timer-for="${g.n}" data-act="timer-wrap">
    <div class="timer-clock" aria-live="polite">${fmtTime(st.left)}</div>
    <div class="timer-bar" aria-hidden="true"><i style="transform:scaleX(${st.total? (st.left/st.total):1})"></i></div>
    <div class="timer-btns">

      <button class="btn sm ghost" type="button" data-act="t-reset">↺ Сброс</button>

      <button class="btn sm ghost" type="button" data-act="t-plus">+1 мин</button>
    </div>
  </div>`;
}

/* per-card remaining, not persisted; only the active one ticks */
const leftMap = new Map();
const totalMap = new Map();
function timerStateFor(n){
  const g = byN[n];
  const def = g ? defaultSecs(g) : 480;
  if(!totalMap.has(n)) totalMap.set(n, def);
  if(!leftMap.has(n)) leftMap.set(n, def);
  return { left: leftMap.get(n), total: totalMap.get(n), def };
}
const Timer = { n:null, running:false, endAt:0, iv:null };

function syncTimerUI(){
  document.querySelectorAll('[data-timer-for]').forEach(box => {
    const n = +box.getAttribute('data-timer-for');
    const st = timerStateFor(n);
    const clock = box.querySelector('.timer-clock');
    const bar = box.querySelector('.timer-bar i');
    const startBtn = box.querySelector('[data-act="t-start"]');
    if(clock) clock.textContent = fmtTime(st.left);
    if(bar) bar.style.transform = 'scaleX(' + (st.total ? (st.left/st.total) : 1) + ')';
    const running = Timer.n === n && Timer.running;
    if(startBtn) startBtn.textContent = running ? '⏸ Пауза' : (st.left < st.total && st.left > 0 ? '▶ Продолжить' : '⏱ Старт');
    box.classList.toggle('timer-done', st.left === 0);
  });
}
function stopTick(){
  if(Timer.iv){ clearInterval(Timer.iv); Timer.iv=null; }
  Timer.running=false;
}
function finishTimer(n){
  stopTick();
  leftMap.set(n, 0);
  Timer.n = n;
  syncTimerUI();
  document.querySelectorAll(`[data-timer-for="${n}"]`).forEach(box => {
    box.classList.remove('timer-flash');
    void box.offsetWidth;
    box.classList.add('timer-flash');
  });
  playChime();
}
function tick(){
  if(!Timer.running || Timer.n==null) return;
  const left = Math.max(0, Math.ceil((Timer.endAt - Date.now())/1000));
  leftMap.set(Timer.n, left);
  syncTimerUI();
  if(left<=0) finishTimer(Timer.n);
}
function startTimer(n){
  const st = timerStateFor(n);
  if(st.left<=0){ leftMap.set(n, st.total || st.def); }
  /* only one running: pause any other */
  if(Timer.running && Timer.n !== n){
    const prev = Timer.n;
    const prevLeft = Math.max(0, Math.ceil((Timer.endAt - Date.now())/1000));
    leftMap.set(prev, prevLeft);
    stopTick();
  }
  const nowLeft = timerStateFor(n).left;
  if(nowLeft<=0) return;
  Timer.n = n;
  Timer.running = true;
  Timer.endAt = Date.now() + nowLeft*1000;
  if(Timer.iv) clearInterval(Timer.iv);
  Timer.iv = setInterval(tick, 200);
  syncTimerUI();
}
function pauseTimer(){
  if(!Timer.running || Timer.n==null) return;
  const left = Math.max(0, Math.ceil((Timer.endAt - Date.now())/1000));
  leftMap.set(Timer.n, left);
  stopTick();
  syncTimerUI();
}
function resetTimer(n){
  const g = byN[n];
  const def = g ? defaultSecs(g) : 480;
  if(Timer.n===n) stopTick();
  totalMap.set(n, def);
  leftMap.set(n, def);
  if(Timer.n===n) Timer.n=null;
  syncTimerUI();
}
function bumpTimer(n, deltaSec){
  const st = timerStateFor(n);
  let left = st.left + deltaSec;
  if(left < 0) left = 0;
  if(left > 60*30) left = 60*30;
  let total = st.total;
  if(left > total) total = left;
  if(Timer.n===n && Timer.running){
    Timer.endAt = Date.now() + left*1000;
  }
  leftMap.set(n, left);
  totalMap.set(n, total);
  if(left===0 && Timer.n===n && Timer.running) finishTimer(n);
  else syncTimerUI();
}

function playChime(){
  if(!S.sound) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = playChime.ac || (playChime.ac = new AC());
    if(ac.state==='suspended') ac.resume();
    const now = ac.currentTime;
    [523.25, 659.25, 783.99].forEach((f,i)=>{
      const o=ac.createOscillator();
      const g=ac.createGain();
      o.type='sine';
      o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, now+i*0.11);
      g.gain.exponentialRampToValueAtTime(0.11, now+i*0.11+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+i*0.11+0.45);
      o.connect(g); g.connect(ac.destination);
      o.start(now+i*0.11); o.stop(now+i*0.11+0.5);
    });
  }catch(e){}
}

function handleTimerAct(act, n, ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  if(act==='t-start'){
    if(Timer.n===n && Timer.running) pauseTimer();
    else startTimer(n);
  }else if(act==='t-reset') resetTimer(n);
  else if(act==='t-minus') bumpTimer(n, -60);
  else if(act==='t-plus') bumpTimer(n, 60);
}

  return `<div class="card${flipped?' is-flipped':''}${played?' is-played':''}" data-n="${g.n}" ${big?'':'tabindex="0"'} role="button" aria-pressed="${flipped?'true':'false'}" aria-label="${esc(g.title)}, колода ${esc(g.deck)}. Нажмите, чтобы перевернуть.">
    <div class="card-sizer" aria-hidden="true"><div class="face-front" style="position:relative">${front}</div></div>
    <div class="card-inner">
      <div class="face face-front">${front}</div>
      <div class="face face-back">
        <div class="back-scroll">
          <div class="back-head">
            <span class="badge ${deckClass(g.deck)}">${esc(g.deck)}</span>
            <h2>${esc(g.title)}</h2>
          </div>
          <div class="meta">
            <span class="chip">${esc(g.gc)}</span>
            <span class="chip">${esc(g.time)}</span>
            <span class="chip">${esc(g.level)}</span>
          </div>
          <p class="goal">${esc(g.goal)}</p>
          <p class="story">${esc(g.story||'')}</p>
          <p class="words">${esc(g.gram||'')}${g.roles&&g.roles.length?' · Роли: '+esc(g.roles.join(', ')):''}</p>
          <p class="words">${esc(g.fmt||'')} ${g.score? '· '+esc(g.score):''}</p>
          <h3 class="sec">Как провести</h3>
          <ol class="steps">${steps}</ol>
          ${g.mat?`<p class="words">Материалы: ${esc(g.mat)}</p>`:''}
          <h3 class="sec">Опоры и примеры</h3>
          ${levels}
          ${words}
        </div>
        ${timerMarkup(g, false)}
        <div class="back-actions">
          <button class="btn sm ${played?'sec':'pri'}" type="button" data-act="played">${played?'✓ Сыграли':'Сыграли'}</button>
          ${big?'':'<button class="btn ghost sm" type="button" data-act="show">Показать классу</button>'}
          <button class="btn ghost sm" type="button" data-act="flip">Перевернуть</button>
        </div>
      </div>
    </div>
  </div>`;
}

function updateStatus(){
  const vis = listVisible();
  const played = vis.filter(g => S.played.has(g.n)).length;
  const flipped = vis.filter(g => S.flipped.has(g.n)).length;
  const label = S.deck === 'all' ? 'все колоды' : 'колода «'+S.deck+'»';
  statusEl.textContent = `${vis.length} карт · ${label} · сыграли ${played} · открыто ${flipped}`;
}

function bindCard(root){
  const card = root.matches && root.matches('.card') ? root : root.querySelector('.card');
  if(!card) return;
  const n = +card.dataset.n;
  const toggle = (force) => {
    const on = force === undefined ? !card.classList.contains('is-flipped') : !!force;
    card.classList.toggle('is-flipped', on);
    card.setAttribute('aria-pressed', on ? 'true' : 'false');
    if(on) S.flipped.add(n); else S.flipped.delete(n);
    ttcSave();
    updateStatus();
    try{ card.scrollIntoView({block:'nearest', inline:'nearest'}); }catch(e){}
  };
  const onActivate = (ev) => {
    if(ev.target.closest('[data-act]')) return;
    toggle();
  };
  card.addEventListener('click', onActivate);
  card.addEventListener('keydown', ev => {
    if(ev.key === 'Enter' || ev.key === ' '){
      if(ev.target.closest('[data-act]')) return;
      ev.preventDefault();
      toggle();
    }
  });
  card.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const act = btn.getAttribute('data-act');
      if(act === 'timer-wrap') return;
      if(act === 'flip') toggle();
      else if(act === 'played'){
        if(S.played.has(n)) S.played.delete(n); else S.played.add(n);
        ttcSave();
        render();
        if($('#spot').classList.contains('open')) openSpot(n);
      }
      else if(act === 'show') openSpot(n);
      else if(act && act.charAt(0)==='t' && act.charAt(1)==='-') handleTimerAct(act, n, ev);
    });
  });
}

function render(){
  const vis = listVisible();
  grid.innerHTML = vis.map(g => renderCard(g)).join('');
  grid.querySelectorAll('.card').forEach(c => bindCard(c));
  document.querySelectorAll('.tab').forEach(t => {
    t.setAttribute('aria-selected', t.dataset.deck === S.deck ? 'true' : 'false');
  });
  updateStatus();
  syncTimerUI();
}

function openSpot(n){
  const g = byN[n];
  if(!g) return;
  const wrap = $('#spot-card');
  wrap.className = 'card spot-card';
  wrap.innerHTML = renderCard(g, {big:true});
  const inner = wrap.querySelector('.card');
  wrap.className = inner.className + ' spot-card';
  wrap.dataset.n = String(n);
  wrap.setAttribute('tabindex','0');
  wrap.innerHTML = inner.innerHTML;
  wrap.classList.remove('is-flipped');
  wrap.setAttribute('aria-pressed','false');
  bindCard(wrap);
  const stimer = $('#spot-timer');
  stimer.hidden = false;
  stimer.setAttribute('data-timer-for', String(n));
  stimer.setAttribute('data-act', 'timer-wrap');
  stimer.className = 'card-timer timer-lg';
  (function(){
    const tmp=document.createElement('div');
    tmp.innerHTML = timerMarkup(g, true);
    stimer.innerHTML = tmp.firstElementChild.innerHTML;
  })();
  stimer.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const act = btn.getAttribute('data-act');
      if(act && act.charAt(0)==='t' && act.charAt(1)==='-') handleTimerAct(act, n, ev);
    });
  });
  const spot = $('#spot');
  spot.classList.add('open');
  spot.setAttribute('aria-hidden','false');
  syncTimerUI();
  $('#spot-close').focus();
}
function closeSpot(){
  const spot = $('#spot');
  spot.classList.remove('open');
  spot.setAttribute('aria-hidden','true');
  $('#spot-card').innerHTML = '';
  const stimer = $('#spot-timer');
  stimer.hidden = true;
  stimer.removeAttribute('data-timer-for');
  stimer.innerHTML = '';
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    S.deck = t.dataset.deck;
    ttcSave();
    render();
  });
});

$('#btn-shuffle').addEventListener('click', () => {
  const vis = listVisible().map(g => g.n);
  for(let i=vis.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [vis[i], vis[j]] = [vis[j], vis[i]];
  }
  if(S.deck === 'all') S.order = vis;
  else {
    const q = vis.slice();
    S.order = S.order.map(n => (byN[n] && byN[n].deck === S.deck) ? q.shift() : n);
  }
  ttcSave();
  render();
});

$('#btn-random').addEventListener('click', () => {
  const vis = listVisible();
  if(!vis.length) return;
  const pool = vis.filter(g => !S.played.has(g.n));
  const pick = (pool.length ? pool : vis)[Math.floor(Math.random()*(pool.length?pool.length:vis.length))];
  const el = grid.querySelector(`.card[data-n="${pick.n}"]`);
  if(el){
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.add('pulse');
    setTimeout(() => el.classList.remove('pulse'), 1000);
    el.focus();
  }
  openSpot(pick.n);
});

$('#btn-unflip').addEventListener('click', () => {
  if(S.deck === 'all') S.flipped.clear();
  else listVisible().forEach(g => S.flipped.delete(g.n));
  ttcSave();
  render();
  if($('#spot').classList.contains('open')){
    const n = +$('#spot-card').dataset.n;
    if(n) openSpot(n);
  }
});

$('#btn-stage').addEventListener('click', async () => {
  const on = !document.body.classList.contains('stage');
  document.body.classList.toggle('stage', on);
  $('#btn-stage').setAttribute('aria-pressed', on ? 'true' : 'false');
  $('#btn-stage').textContent = on ? '🖥 Обычный вид' : '🖥 Большой экран';
  try{
    if(on && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else if(!on && document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
  }catch(e){}
});
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && document.body.classList.contains('stage')){
    document.body.classList.remove('stage');
    $('#btn-stage').setAttribute('aria-pressed','false');
    $('#btn-stage').textContent = '🖥 Большой экран';
  }
});

function syncSoundBtn(){
  const b = $('#btn-sound');
  b.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  b.textContent = S.sound ? '🔔 Звук: вкл' : '🔕 Звук: выкл';
}
$('#btn-sound').addEventListener('click', () => {
  S.sound = !S.sound;
  ttcSave();
  syncSoundBtn();
  if(S.sound) playChime();
});
syncSoundBtn();

$('#spot-close').addEventListener('click', closeSpot);
$('#spot').addEventListener('click', ev => { if(ev.target.id === 'spot') closeSpot(); });
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeSpot(); });

$('#ttc-reset').addEventListener('click', () => {
  if(!confirm('Начать заново? Сохранённые колоды, порядок карт, перевороты и отметки «сыграли» будут удалены.')) return;
  try{ localStorage.removeItem(TTC_KEY); }catch(e){}
  location.reload();
});

render();
</script>
<script src="../_shared/watermark.js" data-mode="bar" data-position="bottom" defer></script>
</body>
</html>
