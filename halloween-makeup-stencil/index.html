function socketPts(G,s,k=1){

const socket=(G,s,k)=>smooth(socketPts(G,s,k));
function hollow(G,s,w=0.09){
  const e=G.P(I('ear',s)),m=G.P(I('mouth',s)),c=G.O(mid(e,m,0.42),0,0.05);

  const p=new Path2D();p.ellipse(c.x,c.y,L*0.42*G.u,w*G.u,Math.atan2(m.y-e.y,m.x-e.x),0,Math.PI*2);return p;
}
function baseP(G,mouthHole){const p=union(polyI(G,OVAL),polyI(G,EYE[-1]),polyI(G,EYE[1]));if(mouthHole)p.addPath(polyI(G,LIPI));return p}

/* ===== painting helpers ===== */
let OP=1;   // global opacity (slider)

function blobPath(G,ctr,rx,ry,rot=0){return ellP(G,ctr,rx,ry,rot)}

function segs(list){const p=new Path2D();list.forEach(([a,b,cp])=>{p.moveTo(a.x,a.y);cp?p.quadraticCurveTo(cp.x,cp.y,b.x,b.y):p.lineTo(b.x,b.y)});return p}

/* ===== professional looks: steps (Russian), drawing and highlight zones ===== */
const BOTH=[-1,1];
const TEMPLE=(G,s)=>G.O(I('browOut',s),s*0.14,-0.06);

function teeth(G){
  const sL=-1,sR=1,cL=G.P(61),cR=G.P(291);

  const line=[eL,cL,m[0],m[1],m[2],cR,eR];

  const segL=[];let tot=0;for(let i=0;i<line.length-1;i++){const d=Math.hypot(line[i+1].x-line[i].x,line[i+1].y-line[i].y);segL.push(d);tot+=d}
  const at=t=>{let d=t*tot;for(let i=0;i<segL.length;i++){if(d<=segL[i]||i===segL.length-1){const k=segL[i]?Math.min(1,d/segL[i]):0;return mid(line[i],line[i+1],k)}d-=segL[i]}};
  const N=14,top=[],bot=[],v=[];
  const hU=G.O(0,0,0),hD=G.O(17,0,0),H=Math.hypot(hD.x-hU.x,hD.y-hU.y)/G.u;
  for(let i=0;i<=N;i++){const t=i/N,p=at(t),f=Math.sin(Math.PI*t),h=(0.035+H*0.42*f);
    const a=G.O(p,0,-h),b=G.O(p,0,h);top.push(a);bot.push(b);if(i>0&&i<N)v.push([a,b])}
  return {mid:smooth(line,false),env:smooth(top.concat(bot.slice().reverse())),v:segs(v),top:smooth(top,false),bot:smooth(bot,false)};
}
function bigMouth(G){
  const c=mid(G.P(61),G.P(291)),half=Math.hypot(G.P(291).x-c.x,G.P(291).y-c.y)/G.u||0.3;

function whiskerDots(G){const p=new Path2D();BOTH.forEach(s=>{const c=pad(G,s);[[0.03,-0.04],[0.08,-0.05],[0.05,0.01],[0.1,0],[0.02,0.05],[0.07,0.05]].forEach(([x,y])=>{const q=G.O(c,s*x,y);p.moveTo(q.x+0.014*G.u,q.y);p.arc(q.x,q.y,0.014*G.u,0,Math.PI*2)})});return p}

const LP=(G,c,list)=>list.map(([x,y])=>G.O(c,x,y));
function sharp(pts){const p=new Path2D();p.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)p.lineTo(pts[i].x,pts[i].y);p.closePath();return p}
function clipped(c,path,rule,fn){c.save();c.clip(path,rule||'nonzero');fn();c.restore()}
function circ(G,ctr,r){const p=new Path2D();p.moveTo(ctr.x+r*G.u,ctr.y);p.arc(ctr.x,ctr.y,r*G.u,0,Math.PI*2);return p}
function arcSample(line){const L=[];let tot=0;for(let i=0;i<line.length-1;i++){const d=Math.hypot(line[i+1].x-line[i].x,line[i+1].y-line[i].y);L.push(d);tot+=d}
  return t=>{let d=t*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i===L.length-1)return mid(line[i],line[i+1],L[i]?Math.min(1,d/L[i]):0);d-=L[i]}}}
const OVALP=G=>polyI(G,OVAL);
// --- pumpkin
function pumpEye(G,s){const c=eyeC(G,s);return sharp(LP(G,c,[[0,-0.25],[0.21,0.13],[-0.21,0.13]]))}
function pumpNose(G){return sharp([G.O(4,0,-0.1),G.O(327,0.03,0.04),G.O(98,-0.03,0.04)])}
function pumpMouth(G){
  const c=mid(G.P(61),G.P(291)),hw=Math.hypot(G.P(291).x-c.x,G.P(291).y-c.y)/G.u+0.14,yt=x=>-0.05-0.1*(x/hw)*(x/hw),yb=x=>yt(x)+0.04+0.16*Math.pow(Math.max(0,1-(x/hw)*(x/hw)),0.8);
  const tw=0.045,top=[],bot=[],N=10,T=[-0.38*hw,0.38*hw];
  for(let i=0;i<=N;i++){const x=-hw+2*hw*i/N;if(T.some(t=>Math.abs(x-t)<tw+0.01))continue;top.push([x,yt(x)])}
  T.forEach(t=>top.push([t-tw,yt(t-tw)],[t-tw,yt(t-tw)+0.07],[t+tw,yt(t+tw)+0.07],[t+tw,yt(t+tw)]));
  top.sort((a,b)=>a[0]-b[0]||0);
  for(let i=N-1;i>0;i--){const x=-hw+2*hw*i/N;if(Math.abs(x)<0.06)continue;bot.push([x,yb(x)])}
  const bt=[[0.05,yb(0.05)],[0.05,yb(0.05)-0.07],[-0.05,yb(-0.05)-0.07],[-0.05,yb(-0.05)]];
  const bot2=bot.filter(p=>p[0]>0).concat(bt,bot.filter(p=>p[0]<0));
  return sharp(LP(G,c,top.concat(bot2)));
}
function pumpRibs(G){const c=G.P(168),L=[];[-0.56,-0.28,0,0.28,0.56].forEach(x=>L.push([G.O(c,x*0.6,-0.75),G.O(c,x*0.85,1.25),G.O(c,x*1.35,0.25)]));return segs(L)}
function pumpStem(G){return smooth([G.O(10,-0.06,0.24),G.O(10,-0.05,0.08),G.O(10,-0.02,-0.04),G.O(10,0.07,-0.06),G.O(10,0.06,0.08),G.O(10,0.06,0.24)])}
function pumpLeaf(G){return smooth([G.O(10,0.06,0.2),G.O(10,0.17,0.08),G.O(10,0.3,0.1),G.O(10,0.2,0.2)])}
function pumpVine(G){return smooth([G.O(10,-0.06,0.2),G.O(10,-0.18,0.16),G.O(10,-0.24,0.06),G.O(10,-0.17,0.02),G.O(10,-0.15,0.09)],false)}
// --- spider web
function webGeo(G){const W=G.O(263,0.0,0.01),A=[-95,-60,-25,10,45,80,115].map(a=>a*Math.PI/180),R=[0.14,0.27,0.41,0.56,0.7];
  const at=(a,r)=>G.O(W,r*Math.cos(a),r*Math.sin(a));return {W,A,R,at}}
function webSpokes(G){const g=webGeo(G);return segs(g.A.map(a=>[g.W,g.at(a,0.76)]))}
function webThreads(G){const g=webGeo(G),L=[];g.R.forEach(r=>{for(let i=0;i<g.A.length-1;i++){const a=g.A[i],b=g.A[i+1];L.push([g.at(a,r),g.at(b,r),g.at((a+b)/2,r*0.8)])}});return segs(L)}
function webSpiderPos(G){return G.O(425,0.03,0.2)}
function spider(G){const S=webSpiderPos(G),p=union(ellP(G,S,0.045,0.056),circ(G,G.O(S,0,-0.065),0.028));return p}
function spiderLegs(G){const S=webSpiderPos(G),L=[];BOTH.forEach(s=>[-0.035,-0.01,0.015,0.04].forEach((y,j)=>{const a=G.O(S,s*0.03,y),k=G.O(S,s*0.085,y-0.05+j*0.015),f=G.O(S,s*0.12,y+0.04+j*0.01);L.push([a,k]);L.push([k,f])}));
  const g=webGeo(G);L.push([g.at(g.A[6],0.56),G.O(S,0,-0.09)]);return segs(L)}
// --- mummy
const MUM_B=[[-0.62,0.1],[-0.45,-0.12],[-0.27,0.08],[-0.08,-0.06],[0.12,0.12],[0.3,-0.1],[0.48,0.07],[0.66,-0.12],[0.84,0.1],[1.02,-0.06]];
function mumBand(G,[y,a],w=0.15){const c=G.O(168,0,y),ex={x:Math.cos(G.rot+a),y:Math.sin(G.rot+a)},ey={x:-ex.y,y:ex.x},L=1.4*G.u,H=w/2*G.u;
  return sharp([{x:c.x-ex.x*L-ey.x*H,y:c.y-ex.y*L-ey.y*H},{x:c.x+ex.x*L-ey.x*H,y:c.y+ex.y*L-ey.y*H},{x:c.x+ex.x*L+ey.x*H,y:c.y+ex.y*L+ey.y*H},{x:c.x-ex.x*L+ey.x*H,y:c.y-ex.y*L+ey.y*H}])}
function mumEdge(G,[y,a],off){const c=G.O(168,0,y),ex={x:Math.cos(G.rot+a),y:Math.sin(G.rot+a)},ey={x:-ex.y,y:ex.x},L=1.4*G.u,o=off*G.u;return [{x:c.x-ex.x*L+ey.x*o,y:c.y-ex.y*L+ey.y*o},{x:c.x+ex.x*L+ey.x*o,y:c.y+ex.y*L+ey.y*o}]}
const mumHoles=G=>union(OVALP(G),socket(G,-1,0.85),socket(G,1,0.85));
const mumBands=G=>union(...MUM_B.map(b=>mumBand(G,b)));
// --- catrina
const CAT_COL={'-1':['#e0218a',[224,33,138]],'1':['#16b3c7',[22,179,199]]};
function petals(G,s){const c=eyeC(G,s),p=new Path2D();for(let k=0;k<8;k++){const a=k*Math.PI/4+Math.PI/8,q=G.O(c,0.24*Math.cos(a),0.21*Math.sin(a));p.addPath(ellP(G,q,0.1,0.065,a))}return p}
const catrinaSocket=(G,s)=>ellP(G,eyeC(G,s),0.2,0.165);
function heartNose(G){const t=G.O(4,0,-0.01),p=union(circ(G,G.O(t,-0.037,-0.012),0.042),circ(G,G.O(t,0.037,-0.012),0.042));p.addPath(sharp([G.O(t,-0.077,0),G.O(t,0.077,0),G.O(t,0,0.085)]));return p}
function stitchLips(G){const line=[G.O(61,-0.13,0),G.P(61),mid(G.P(82),G.P(87)),mid(G.P(13),G.P(14)),mid(G.P(312),G.P(317)),G.P(291),G.O(291,0.13,0)],f=arcSample(line),L=[];
  for(let i=1;i<10;i++){const q=f(i/10),h=0.05+0.05*Math.sin(Math.PI*i/10);L.push([G.O(q,0,-h),G.O(q,0,h)])}return {line:smooth(line,false),st:segs(L)}}
function foreFlower(G){const c=G.O(9,0,-0.3),p=new Path2D();for(let k=0;k<6;k++){const a=k*Math.PI/3,q=G.O(c,0.075*Math.cos(a),0.075*Math.sin(a));p.addPath(ellP(G,q,0.06,0.035,a))}return {p,c}}
function dotRing(G){const p=new Path2D();BOTH.forEach(s=>{const c=eyeC(G,s);for(let k=0;k<7;k++){const a=Math.PI*(1.1+0.8*k/6);p.addPath(circ(G,G.O(c,0.36*Math.cos(a),0.33*Math.sin(a)),0.016))}});
  for(let k=-3;k<=3;k++)p.addPath(circ(G,G.O(152,k*0.055,-0.1-0.02*Math.abs(k)),0.018));return p}
// --- ghost
const SPARK=(()=>{let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647,a=[];for(let i=0;i<70;i++)a.push([r()*1.5-0.75,r()*1.9-0.85,0.006+r()*0.012]);return a})();
function ghostTears(G){return union(...both(s=>{const c=eyeC(G,s);return smooth([G.O(c,-0.1,0.1),G.O(c,0.1,0.1),G.O(c,0.06,0.3),G.O(c,0.02,0.42),G.O(c,-0.03,0.3)])}))}
// --- bat
function batMask(G){const c=mid(G.P(33),G.P(263)),h=[[0,-0.2],[0.03,-0.27],[0.075,-0.43],[0.11,-0.27],[0.2,-0.3],[0.42,-0.44],[0.78,-0.32],[0.72,0.0],[0.6,0.18],[0.47,0.12],[0.34,0.25],[0.2,0.13],[0.08,0.18],[0,0.1]];
  const pts=h.concat(h.slice(1,-1).reverse().map(([x,y])=>[-x,y]));return sharp(LP(G,c,pts))}
function batHoles(G){return union(...both(s=>{const c=eyeC(G,s);return smooth(EYE[s].map(i=>{const q=G.P(i);return {x:c.x+(q.x-c.x)*1.25,y:c.y+(q.y-c.y)*1.45}}))}))}
function batBones(G){const c=mid(G.P(33),G.P(263)),L=[];BOTH.forEach(s=>{const o=G.O(c,s*0.11,-0.24);[[0.78,-0.32],[0.72,0.0],[0.47,0.12],[0.2,0.13]].forEach(([x,y])=>L.push([o,G.O(c,s*x,y),G.O(c,s*(x*0.6),y-0.12)]))});return segs(L)}
function fangs(G){const p=new Path2D();BOTH.forEach(s=>{const b=mid(G.P(s<0?82:312),G.P(s<0?87:317));p.addPath(sharp([G.O(b,-0.03,-0.01),G.O(b,0.03,-0.01),G.O(b,s*0.005,0.12)]))});return p}

    witch: { color: '#006400', lineWidth: 3, connections: [[70,63],[63,105],[105,66],[66,107],[300,293],[293,334],[334,296],[296,336],[61,291],[13,14]] },
    pumpkin: { color: '#ff8c1a', lineWidth: 2, zones: true, connections: [] },
    spiderweb: { color: '#d0d0ff', lineWidth: 2, zones: true, connections: [] },
    mummy: { color: '#e8d9b5', lineWidth: 2, zones: true, connections: [] },
    catrina: { color: '#ff4fb0', lineWidth: 2, zones: true, connections: [] },
    ghost: { color: '#9fd0ff', lineWidth: 2, zones: true, connections: [] },
    bat: { color: '#b46cff', lineWidth: 2, zones: true, connections: [] },
    none: { color: '#000000', lineWidth: 0, connections: [] }
  };
  const BEFORE = { t: 'Перед началом', html: '<ul>' +
    '<li>Используй <b>только косметический аквагрим</b> для лица. Гуашь, акрил, фломастеры и маркеры — нельзя.</li>' +
    '<li><b>Тест на коже:</b> нанеси капельку на внутреннюю сторону руки (лучше за день). Покраснело или чешется — не используй.</li>' +
    '<li><b>Глаза и губы</b> — только средствами, где написано, что их можно для век/губ. Не рисуй по слизистой и близко к ресницам.</li>' +
    '<li>Не наноси на раздражённую кожу, ранки и прыщики.</li>' +
    '<li><b>Как смыть:</b> тёплая вода и мягкое мыло или мицеллярная вода, без трения; потом — крем.</li>' +
    '<li>Попроси взрослого помочь, особенно возле глаз.</li></ul>' };

  let currentStyle = DEFAULTS.style, opacity = DEFAULTS.opacity, view = DEFAULTS.view, guide = false;
  let stepIdx = {};          // look -> -1 (before), 0..n-1, n (done)
  let faceMesh = null, stream = null;
  let running = false, busy = false, gotResult = false, noFaceFrames = 0;
  let snapWanted = false, lastG = null, lastHl = 0;

  /* ---------- saved settings ---------- */
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === 'object') {
        if (Object.prototype.hasOwnProperty.call(LINES, s.style)) currentStyle = s.style;
        const o = Number(s.opacity);
        if (o >= 0.2 && o <= 1) opacity = Math.round(o * 10) / 10;
        if (s.view === 'look' || s.view === 'lines') view = s.view;
        guide = s.guide === true;
        if (s.steps && typeof s.steps === 'object') Object.keys(LOOKS).forEach(function (k) {
          const v = s.steps[k];
          if (Number.isInteger(v) && v >= -1 && v <= LOOKS[k].steps.length) stepIdx[k] = v;
        });
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, style: currentStyle, opacity: opacity, view: view, guide: guide, steps: stepIdx })); } catch (e) {}
  }
  const curStep = () => (currentStyle in stepIdx ? stepIdx[currentStyle] : -1);

  function paintUI() {
    styleBtns.forEach(function (b) {
      const on = b.dataset.style === currentStyle;
      b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    opacitySlider.value = String(opacity);
    opacityVal.textContent = Math.round(opacity * 100) + '%';
    [['view-look', 'look'], ['view-lines', 'lines']].forEach(function (p) {
      const b = $(p[0]), on = view === p[1]; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    const canGuide = currentStyle !== 'none';
    guideBtn.disabled = !canGuide;
    guideBtn.classList.toggle('on', guide && canGuide);
    guideBtn.setAttribute('aria-pressed', guide && canGuide ? 'true' : 'false');
    guideBtn.textContent = guide && canGuide ? '📋 Скрыть подсказки' : '📋 Пошагово';
    paintGuide();
  }
  function paintGuide() {
    const on = guide && currentStyle !== 'none';
    guideEl.hidden = !on;
    if (!on) return;
    const L = LOOKS[currentStyle], n = L.steps.length, k = curStep();
    const back = $('g-back'), next = $('g-next');
    $('g-dots').innerHTML = L.steps.map(function (_, i) { return '<i class="' + (i < k ? 'done' : i === k ? 'cur' : '') + '"></i>'; }).join('');
    back.hidden = k < 0;
    if (k < 0) {
      $('g-count').textContent = L.name + ' · ' + n + ' шагов';
      $('g-title').textContent = '⚠️ ' + BEFORE.t;
      $('g-text').innerHTML = BEFORE.html;
      $('g-meta').hidden = true; $('g-tip').textContent = '';
      next.textContent = 'Понятно, начинаем →';
    } else if (k >= n) {
      $('g-count').textContent = 'Все ' + n + ' шагов пройдены';
      $('g-title').textContent = '🎉 Образ готов!';
      $('g-text').textContent = 'Отлично! Сравни себя с превью, поправь края спонжем и сделай фото. Не забудь смыть грим перед сном.';
      $('g-meta').hidden = true; $('g-tip').textContent = '';
      next.textContent = '↺ Пройти заново';
    } else {
      const s = L.steps[k];
      $('g-count').textContent = 'Шаг ' + (k + 1) + ' из ' + n;
      $('g-title').textContent = s.t;
      $('g-text').textContent = s.d;
      $('g-meta').hidden = false;
      $('g-tool').textContent = '🖌️ ' + s.tool;
      $('g-sw').innerHTML = '<span class="swatch"></span>';
      $('g-sw').firstChild.style.background = s.sw[0];
      $('g-sw').appendChild(document.createTextNode(s.sw[1]));
      $('g-tip').textContent = '💡 ' + s.tip;
      next.textContent = k === n - 1 ? 'Готово ✓' : 'Далее →';
    }
  }

  /* ---------- canvas & landmarks ---------- */
  let cw = 0, ch = 0, dpr = 1;
  function resizeCanvas() {
    const w = container.clientWidth, h = container.clientHeight, r = Math.min(2, window.devicePixelRatio || 1);
    if (w === cw && h === ch && r === dpr) return;
    cw = w; ch = h; dpr = r;
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    sm = null;
  }
  // The frame is drawn with "cover" fit; landmarks go through the same crop/scale (canvas px).
  function coverOf(img) {
    const vw = img.width || video.videoWidth || 640, vh = img.height || video.videoHeight || 480;
    const W = canvas.width, H = canvas.height, s = Math.max(W / vw, H / vh);
    return { vw: vw, vh: vh, s: s, dx: (W - vw * s) / 2, dy: (H - vh * s) / 2 };
  }
  let sm = null;   // smoothed landmarks (canvas px)
  function track(lms, cv) {
    const pts = lms.map(function (p) { return { x: p.x * cv.vw * cv.s + cv.dx, y: p.y * cv.vh * cv.s + cv.dy }; });
    if (sm && sm.length === pts.length) {
      const u = Math.hypot(pts[263].x - pts[33].x, pts[263].y - pts[33].y) || 1;
      const jump = Math.hypot(pts[1].x - sm[1].x, pts[1].y - sm[1].y) / u;
      if (jump < 0.3) {
        const a = jump > 0.08 ? 0.75 : 0.5;  // follow fast moves quickly, damp jitter when still
        for (let i = 0; i < pts.length; i++) { sm[i].x += (pts[i].x - sm[i].x) * a; sm[i].y += (pts[i].y - sm[i].y) * a; }
        return sm;
      }
    }
    sm = pts;
    return sm;
  }

  function drawLook(c, G, look, upto) {
    const L = LOOKS[look];
    for (let i = 0; i <= upto && i < L.steps.length; i++) L.steps[i].draw(c, G);
  }
  function drawLines(c, pts, look, G) {
    const st = LINES[look]; if (!st.connections.length && !st.zones) return;
    const W = c.canvas.width, H = c.canvas.height, lm = pts.map(function (p) { return { x: p.x / W, y: p.y / H }; });
    const w = function (n) { return n * dpr; };
    c.save(); c.globalAlpha = opacity;
    drawConnectors(c, lm, FACEMESH_FACE_OVAL, { color: '#55555580', lineWidth: w(1) });
    [FACEMESH_LEFT_EYE, FACEMESH_RIGHT_EYE].forEach(function (s) { drawConnectors(c, lm, s, { color: st.color + 'cc', lineWidth: w(2) }); });
    [FACEMESH_LIPS, FACEMESH_LEFT_EYEBROW, FACEMESH_RIGHT_EYEBROW].forEach(function (s) { drawConnectors(c, lm, s, { color: st.color + 'aa', lineWidth: w(2) }); });
    c.strokeStyle = st.color; c.lineWidth = st.lineWidth * dpr; c.lineCap = 'round';
    if (st.zones) {   // newer looks: the stencil is the outline of every makeup zone
      c.lineWidth = Math.max(1.5, G.u * 0.012); c.lineJoin = 'round';
      LOOKS[look].steps.forEach(function (stp) { stp.hl(G).forEach(function (pth) { c.stroke(pth); }); });
    }
    st.connections.forEach(function (k) { const a = pts[k[0]], b = pts[k[1]]; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); });
    c.restore();
  }
  function drawHighlight(c, G, paths, t) {
    const pulse = 0.5 + 0.5 * Math.sin(t / 260);
    c.save();
    paths.forEach(function (p) {
      c.globalAlpha = 0.12 + 0.12 * pulse; c.fillStyle = '#00e5ff'; c.fill(p);
      c.globalAlpha = 0.85 + 0.15 * pulse; c.strokeStyle = '#00e5ff'; c.lineWidth = Math.max(2, G.u * 0.018);
      c.setLineDash([G.u * 0.05, G.u * 0.035]); c.lineDashOffset = -t / 40; c.stroke(p);
    });
    c.restore();
  }
  // Paint one frame: camera image + makeup (+ hints)
  function paint(c, img, cv, pts, withHints, t) {
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    c.fillStyle = '#000'; c.fillRect(0, 0, c.canvas.width, c.canvas.height);
    if (img) c.drawImage(img, cv.dx, cv.dy, cv.vw * cv.s, cv.vh * cv.s);
    c.restore();
    lastHl = 0;
    if (!pts || currentStyle === 'none') return;
    const G = makeG(pts); lastG = G;
    const L = LOOKS[currentStyle], n = L.steps.length;
    const g = guide ? curStep() : n;
    const upto = guide ? Math.min(g, n - 1) : n - 1;   // guided: steps up to the current one
    OP = opacity;
    if (view === 'look') { if (!guide || g >= 0) drawLook(c, G, currentStyle, upto); }
    else drawLines(c, pts, currentStyle, G);
    OP = 1;
    if (withHints && guide && g >= 0 && g < n) { const hp = L.steps[g].hl(G); drawHighlight(c, G, hp, t); lastHl = hp.length; }
  }

  function onResults(results) {
    resizeCanvas();
    const img = results.image, cv = coverOf(img);
    const faces = results.multiFaceLandmarks;
    let pts = null;
    if (faces && faces.length > 0) {
      noFaceFrames = 0;
      pts = track(faces[0], cv);
      if (!gotResult || statusEl.dataset.k !== 'ok') setStatus('ok', 'Камера работает! Выбери образ или включи «Пошагово».');
    } else {
      sm = null;
      if (++noFaceFrames > 15) setStatus('noface', 'Лицо не видно — посмотри прямо в камеру, нужен хороший свет.');
    }
    paint(ctx, img, cv, pts, true, performance.now());
    if (snapWanted) { snapWanted = false; doSnap(img, pts); }
    gotResult = true;
  }
  function setStatus(k, t) { statusEl.dataset.k = k; statusEl.textContent = t; }

  /* ---------- photo ---------- */
  function doSnap(img, pts) {
    try {
      const a = document.createElement('canvas'); a.width = canvas.width; a.height = canvas.height;
      const ac = a.getContext('2d');
      paint(ac, img, coverOf(img), pts, false, 0);
      const b = document.createElement('canvas'); b.width = a.width; b.height = a.height;
      const bc = b.getContext('2d'); bc.translate(b.width, 0); bc.scale(-1, 1); bc.drawImage(a, 0, 0);   // mirror like the screen
      b.toBlob(function (blob) {
        if (!blob) { setStatus('err', 'Не получилось сохранить фото.'); return; }
        const url = URL.createObjectURL(blob), link = document.createElement('a');
        link.href = url; link.download = 'halloween-makeup-' + currentStyle + '.png';
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        setStatus('ok', '📷 Фото сохранено на устройство.');
      }, 'image/png');
    } catch (e) { setStatus('err', 'Не получилось сохранить фото.'); }
  }

  /* ---------- camera ---------- */
  function loop() {
    if (!running) return;
    if (!busy && video.readyState >= 2) {
      busy = true;
      faceMesh.send({ image: video }).then(function () { busy = false; }, function (err) { busy = false; console.warn(err); });
    }
    requestAnimationFrame(loop);
  }
  async function startCamera() {
    startBtn.disabled = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('err', 'Этот браузер не даёт доступ к камере. Открой страницу в Chrome или Safari.');
      startBtn.disabled = false; return;
    }
    if (typeof FaceMesh !== 'function' || typeof drawConnectors !== 'function') {
      setStatus('err', 'Не удалось загрузить модель. Обнови страницу.');
      startBtn.disabled = false; return;
    }
    setStatus('load', 'Загрузка модели...');
    try {
      if (!faceMesh) {
        faceMesh = new FaceMesh({ locateFile: function (file) { return 'vendor/face_mesh/' + file; } });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);
      }
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      video.srcObject = stream;
      await video.play().catch(function () {});
      running = true;
      placeholder.hidden = true; startBtn.hidden = true; panel.hidden = false;
      resizeCanvas();
      setStatus('load', 'Камера включена. Загружаю модель лица…');
      loop();
    } catch (err) {
      const name = err && err.name;
      const why = name === 'NotAllowedError' ? 'доступ к камере запрещён — разреши его в настройках браузера'
        : name === 'NotFoundError' ? 'камера не найдена'
        : name === 'NotReadableError' ? 'камера занята другим приложением'
        : (err && err.message) || String(err);
      setStatus('err', 'Ошибка камеры: ' + why + '.');
      startBtn.disabled = false;
    }
  }

  /* ---------- UI events ---------- */
  styleBtns.forEach(function (btn) {
    btn.addEventListener('click', function () { currentStyle = btn.dataset.style; paintUI(); save(); });
  });
  $('view-look').addEventListener('click', function () { view = 'look'; paintUI(); save(); });
  $('view-lines').addEventListener('click', function () { view = 'lines'; paintUI(); save(); });
  opacitySlider.addEventListener('input', function (e) {
    const v = parseFloat(e.target.value);
    if (v >= 0.2 && v <= 1) opacity = v;
    paintUI(); save();
  });
  guideBtn.addEventListener('click', function () {
    guide = !guide;
    if (guide && !(currentStyle in stepIdx)) stepIdx[currentStyle] = -1;
    paintUI(); save();
    if (guide) guideEl.scrollIntoView({ block: 'nearest' });
  });
  $('g-next').addEventListener('click', function () {
    const n = LOOKS[currentStyle].steps.length, k = curStep();
    stepIdx[currentStyle] = k >= n ? 0 : k + 1;
    paintUI(); save();
  });
  $('g-back').addEventListener('click', function () {
    const k = curStep();
    stepIdx[currentStyle] = Math.max(-1, k - 1);
    paintUI(); save();
  });
  snapBtn.addEventListener('click', function () {
    if (!running) return;
    snapWanted = true;
  });
  $('reset-btn').addEventListener('click', function () {
    if (!confirm('Сбросить образ, шаги и настройки к начальным?')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    currentStyle = DEFAULTS.style; opacity = DEFAULTS.opacity; view = DEFAULTS.view; guide = false; stepIdx = {};
    paintUI();
  });
  startBtn.addEventListener('click', startCamera);
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('pagehide', function () {
    running = false;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  });
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted || running) return;   // back/forward cache: the camera was stopped
    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    placeholder.hidden = false; panel.hidden = true;
    startBtn.hidden = false; startBtn.disabled = false;
    setStatus('idle', 'Нажми «Старт», чтобы включить камеру');
  });

  load(); paintUI(); resizeCanvas();
  window.__stencil = {
    get style() { return currentStyle; }, get opacity() { return opacity; }, get gotResult() { return gotResult; },
    get view() { return view; }, get guide() { return guide; }, get step() { return curStep(); }, get hl() { return lastHl; },
    faceBox: function () {
      if (!sm) return null;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      OVAL.forEach(function (i) { const p = sm[i]; x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
      return { x0: x0, y0: y0, x1: x1, y1: y1, w: canvas.width, h: canvas.height, u: lastG ? lastG.u : 0 };
    },
    pt: function (i) { return sm ? { x: sm[i].x, y: sm[i].y } : null; }
  };
  })();
  </script>
</body>
</html>
