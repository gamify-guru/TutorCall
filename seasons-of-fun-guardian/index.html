<style id="tc-fix">html,body{overflow-x:hidden}
#root{overflow-x:clip}
button{touch-action:manipulation}
.tc-reset{white-space:nowrap;cursor:pointer;border:2px solid rgba(76,29,149,.25);background:rgba(255,255,255,.92);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;color:#4c1d95;-webkit-tap-highlight-color:transparent;font-family:Nunito,system-ui,sans-serif}
.tc-reset:hover{border-color:#4c1d95}
.tc-reset-fixed{position:fixed;left:10px;bottom:10px;z-index:45;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (max-width:420px){.tc-reset{padding:4px 9px;font-size:12px}}
.tc-allok{flex:1;padding:12px 16px;border-radius:12px;background:#ecfdf5;border:2px solid #6ee7b7;color:#047857;font-weight:800}
.tc-full{width:100%;margin:0}
.tc-cyr{margin-top:8px;font-size:13px;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:6px 10px}
.tc-inp{font-size:16px;max-width:100%}
.tc-pair{display:inline-block;margin:2px 10px 2px 0}
.tc-arrow{width:28px!important;height:24px!important;font-size:14px!important;line-height:1}
.option-btn:disabled{cursor:default}
.btn-magic.fixed{position:fixed}
.tc-pt>div{padding-top:150px}
@media (min-width:768px){.tc-pt>div{padding-top:156px}}
</style>
