<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Домашнее расследование — The Secret of Grandpa's Garden</title>
<meta name="theme-color" content="#241a12">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bark:#241a12;--bark2:#3a2a1c;--kraft:#f4e6cb;--kraft2:#e7d4ad;--kraft3:#d6bf92;--ink:#2b211a;--sun:#e9a13b;--sun2:#f6c871;--koi:#de5f26;--leaf:#3f6b3d;--leaf2:#568c4f;
--display:"Fraunces",Georgia,serif;--body:"Nunito",ui-sans-serif,system-ui,sans-serif;--hand:"Caveat",cursive}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bark);min-height:100vh;font-size:17px;line-height:1.45;padding-bottom:70px;touch-action:manipulation}
.bg{position:fixed;inset:0;z-index:-1}.bg img{width:100%;height:100%;object-fit:cover;opacity:.3;filter:blur(3px)}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(36,26,18,.85),rgba(36,26,18,.7),rgba(36,26,18,.95))}
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bark2),var(--bark));border-bottom:3px solid var(--sun);box-shadow:0 8px 30px -10px #000}
.hwrap{max-width:980px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:50%;background:var(--leaf);border:2px solid var(--sun2);display:grid;place-items:center;font-size:18px}
.ttl{font-family:var(--display);font-weight:800;color:var(--sun2);font-size:18px;line-height:1.1}.sub{color:var(--kraft3);font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}
.dots{display:flex;gap:6px;margin-left:auto;align-items:center}.dot{width:28px;height:28px;border-radius:50%;border:2px solid #f4e6cb55;display:grid;place-items:center;font-size:13px;color:#f4e6cb66;font-weight:800}
.dot.got{border-color:var(--sun);background:#e9a13b30;color:var(--sun2);box-shadow:0 0 12px #e9a13b70}
.btn{font-family:var(--body);font-weight:800;letter-spacing:.02em;font-size:15px;border-radius:7px;padding:10px 16px;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 4px #00000059;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px);box-shadow:0 2px #00000059}
.btn.sun{background:linear-gradient(var(--sun2),var(--sun));color:var(--ink)}.btn.leaf{background:linear-gradient(var(--leaf2),var(--leaf));color:var(--kraft)}
.btn.ghost{background:#f4e6cb14;color:var(--kraft);border:1px solid #f4e6cb55;box-shadow:none}.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:0 auto;padding:18px 14px}
.paper{background-color:var(--kraft);background-image:radial-gradient(circle at 18% 12%,#de5f2612,#0000 45%),radial-gradient(circle at 82% 88%,#3f6b3d17,#0000 50%),repeating-linear-gradient(0deg,#2b211a07 0 1px,#0000 1px 4px);border-radius:8px;box-shadow:inset 0 1px #ffffff80,0 22px 48px -22px #000d;padding:22px 20px;margin-bottom:18px}
h1,h2,h3{font-family:var(--display);margin:0}h2{font-size:26px;line-height:1.15;color:var(--ink)}
.kick{font-size:11px;text-transform:uppercase;letter-spacing:.2em;font-weight:800;color:var(--koi)}
.lead{font-size:17px;margin:8px 0}
.hand{font-family:var(--hand);font-size:22px;color:#2b211aa6}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.file{display:flex;gap:12px;align-items:center;text-align:left;background:#fff8;border:2px solid var(--kraft3);border-radius:8px;padding:12px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
.file:hover{border-color:var(--sun);transform:translateY(-2px)}.file .ic{font-size:30px}.file .t{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}.file .f{font-size:13px;color:#2b211a99}
.file.done{background:#e3f1dc;border-color:var(--leaf)}.file.done .t:after{content:" ✓";color:var(--leaf)}
.intro{background:#fff8;border-left:5px solid var(--sun);padding:8px 12px;border-radius:4px;margin:10px 0 14px}
ol.items{list-style:none;margin:0;padding:0}
.it{padding:14px 0;border-top:2px dashed var(--kraft3)}.it:first-child{border-top:0}
.it.done{background:#e3f1dc66}
.q{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;font-weight:700;font-size:18px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-size:14px;font-weight:900}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.op{font:inherit;font-weight:800;border:2px solid var(--kraft3);background:#fff;color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:46px;text-align:left;box-shadow:0 3px #2b211a40}
.op:hover{border-color:var(--sun)}.op.ok{background:var(--leaf);color:var(--kraft);border-color:var(--leaf)}.op.no{background:#f6d4c8;border-color:var(--koi);color:#8a2f0d}.op[disabled]{cursor:default}.op.dim{opacity:.5}
.word{font:inherit;font-weight:800;border:2px solid transparent;background:#fff8;border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--ink);min-height:40px}
.word:hover{border-color:var(--sun)}.word.bad{background:var(--koi);color:#fff}.word.no{background:#f6d4c8;border-color:var(--koi)}.word[disabled]{cursor:default}
.sentence{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;font-size:19px}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;min-height:52px}
.slot{width:44px;height:50px;border-radius:7px;border:2px dashed var(--kraft3);background:#fff8;display:grid;place-items:center;font-weight:900;font-size:22px;text-transform:uppercase;color:var(--ink);cursor:pointer;font-family:var(--body);padding:0}
.slot.f{border-style:solid;border-color:var(--sun);background:#fff}.slot.good{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.tiles{display:flex;gap:7px;flex-wrap:wrap}
.tile{width:46px;height:50px;border-radius:7px;border:2px solid var(--ink);background:var(--kraft2);font-weight:900;font-size:22px;text-transform:uppercase;cursor:pointer;color:var(--ink);box-shadow:0 3px #2b211a55;font-family:var(--body);padding:0}
.tile.used{opacity:.25;cursor:default}
.fb{margin-top:8px;font-size:16px;min-height:0}.fb.good{color:var(--leaf);font-weight:700}.fb.hint{color:#9a3a10;font-weight:700}
.memo{background:#fff9;border:2px solid var(--kraft3);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:17px}
.say{border:0;background:#2b211a14;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:16px;margin-left:6px}
textarea{width:100%;min-height:170px;font-family:var(--hand);font-size:23px;border:2px solid #2b211a33;border-radius:8px;padding:10px 12px;background:#fffc;color:var(--ink);resize:vertical;line-height:1.3}
textarea:focus{outline:0;border-color:var(--sun)}
.fbl{padding:5px 0;font-size:16px}.fbl.ok{color:var(--leaf)}.fbl.no{color:#9a3a10}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-block;background:#fff9;border:1px solid var(--kraft3);border-radius:999px;padding:2px 10px;margin:2px;font-size:15px;font-weight:700}
.reward{text-align:center}.badge{width:150px;height:150px;margin:6px auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--sun2),var(--sun) 60%,#9a6a1c);border:6px double var(--ink);display:grid;place-items:center;font-size:62px;box-shadow:0 10px 30px -8px #0009;animation:pop .7s}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}70%{transform:scale(1.1) rotate(6deg)}100%{transform:none;opacity:1}}
.code{font-family:var(--display);font-weight:900;font-size:32px;letter-spacing:.2em;color:var(--koi);border:3px dashed var(--koi);display:inline-block;padding:6px 16px;border-radius:8px;margin:8px 0}
.stamp{font-family:var(--display);font-weight:900;color:var(--koi);border:5px solid var(--koi);display:inline-block;padding:6px 18px;transform:rotate(-6deg);font-size:26px;border-radius:8px}
.shake{animation:sh .45s}@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fixed{position:fixed;left:10px;z-index:50;font:600 12px/1 system-ui,sans-serif;padding:7px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.88);color:#333;cursor:pointer;opacity:.8}
#tc-reset{bottom:12px}#tc-mute{bottom:46px}
@media(max-width:560px){h2{font-size:22px}.paper{padding:18px 12px}.dot{width:24px;height:24px;font-size:11px}.q{font-size:17px}.slot,.tile{width:40px;height:46px;font-size:20px}}
</style>
</head>
<body>
<div class="bg"><img src="images/garden-hero.jpg" alt=""></div>
<header><div class="hwrap">
 <div class="logo">🔍</div>
 <div><div class="ttl">Домашнее расследование</div><div class="sub">Grandpa's Garden · Unit 8</div></div>
 <div class="dots" id="dots"></div>
 <a class="btn ghost sm" href="./" id="back-link">← К расследованию</a>
</div></header>
<main id="app"></main>
<button id="tc-mute" class="fixed" type="button" aria-label="Звук"></button>
<button id="tc-reset" class="fixed" type="button" title="Удалить ответы домашнего задания">↺ Начать заново</button>
<script>
const KEY='tutorcall-grandpas-garden-hw-v1';
const fresh=()=>({done:{},a:{},miss:0,mute:false});
let S=load();function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return fresh()}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const I=id=>(S.a[id]=S.a[id]||{});
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else if(k==='cls')e.className=v;else if(v!==false&&v!=null)e.setAttribute(k,v)}c.flat().forEach(x=>x!=null&&e.append(x));return e};
const app=document.getElementById('app');
/* speech (en-GB) with mute */
function say(t){if(S.mute)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;const v=(speechSynthesis.getVoices()||[]).find(x=>/en[-_]GB/i.test(x.lang));if(v){try{u.voice=v}catch(e){}}speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const sayBtn=t=>h('button',{cls:'say',type:'button','aria-label':'Послушать',onclick:e=>{e.stopPropagation();say(t)}},'🔊');
function muteLabel(){const b=document.getElementById('tc-mute');b.textContent=S.mute?'🔇 Звук выкл.':'🔊 Звук вкл.';b.setAttribute('aria-pressed',S.mute?'true':'false')}
document.getElementById('tc-mute').onclick=()=>{S.mute=!S.mute;save();muteLabel();if(S.mute)try{speechSynthesis.cancel()}catch(e){}};
/* helpers */
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),460)}
function lk(el,ms){const n=Date.now();if(n-(el._t||0)<(ms||450))return true;el._t=n;return false}
function miss(){S.miss++;save()}
const hasCyr=s=>/[\u0400-\u04FF]/.test(s);
const HOMO={'а':'a','е':'e','о':'o','р':'p','с':'c','у':'y','х':'x','к':'k','м':'m','т':'t','в':'b','н':'h','і':'i','ё':'e'};
const lat=s=>String(s).toLowerCase().replace(/[\u0400-\u04FF]/g,c=>HOMO[c]||c).replace(/[’‘`´ʼ]/g,"'");
const list=()=>h('ol',{cls:'items'});
let TASK_DONE=()=>{};
/* ---------------- TASKS ---------------- */
const T=[
{id:'t1',icon:'⚖️',title:'Правда или ложь?',fmt:'True / False',
 intro:'Подумай про сад дедушки. Нажми <b>True</b>, если предложение верное, и <b>False</b>, если нет. Если ошибся — попробуй ещё раз.',
 items:[["Fish have got fins and scales.",true,'Верно: у рыб есть плавники (fins) и чешуя (scales).'],["Birds have got wings and feathers.",true,'Верно: крылья (wings) и перья (feathers).'],["The squirrel has got soft brown fur.",true,'Верно: у белки мягкий коричневый мех (fur).'],["Flowers have got scales and fins.",false,'Нет: чешуя и плавники — у рыб. У цветов есть <b>stem</b> и <b>petals</b>.'],["Roots are above the ground.",false,'Нет: корни (roots) растут <b>под землёй</b>, в почве (soil).'],["A petal is a soft coloured part of a flower.",true,'Верно: petal — лепесток.'],["The fish have got wings.",false,'Нет: у рыб плавники (fins), а крылья — у птиц.'],["The spine is the middle line of a leaf.",true,'Верно: spine — центральная жилка листа.']]},
{id:'t2',icon:'🕵️',title:'Лишняя улика',fmt:'Найди лишнее',
 intro:'В каждой строке одна «улика» лишняя. Нажми на то, что <b>не подходит</b> к остальным.',
 items:[[['petal','stem','roots','fur'],'fur','petal, stem, roots — части цветка; <b>fur</b> — мех животного.'],[['fins','scales','wings','soil'],'soil','fins, scales, wings — части тела животных; <b>soil</b> — почва.'],[['feathers','wings','fur','stem'],'stem','feathers, wings, fur — части тела животных; <b>stem</b> — стебель растения.'],[['spine','petal','stem','feathers'],'feathers','spine, petal, stem — части растений; <b>feathers</b> — перья птицы.'],[['Fish have got fins.','Birds have got wings.','The leaf have got a spine.','Flowers have got petals.'],'The leaf have got a spine.','Одно leaf — единственное число: <b>The leaf has got</b> a spine.'],[['The bird has got feathers.','The squirrel has got fur.','The fish has got scales.','The flowers has got petals.'],'The flowers has got petals.','Flowers — много цветов (мн. число): <b>The flowers have got</b> petals.'],[['We have got a pond.','They have got a garden.','You have got a pen.','I has got a ball.'],'I has got a ball.','С <b>I</b> — have got: <b>I have got</b> a ball.']]},
{id:'t3',icon:'🔤',title:'Собери слово из букв',fmt:'Буквы-плитки',
 intro:'Нажимай на буквы по порядку, чтобы собрать слово. Нажми на букву в ячейке, чтобы убрать её. Слово можно послушать 🔊.',
 items:[['spine','центральная жилка листа','🍃'],['petal','лепесток','🌸'],['scales','чешуя','🐟'],['stem','стебель','🌱'],['roots','корни','🌿'],['feathers','перья','🪶'],['wings','крылья','🕊️'],['fur','мех','🐿️']]},
{id:'t4',icon:'🎯',title:'Найди ошибку',fmt:'Нажми на неверное слово',
 intro:'В каждом предложении одно слово неверное (have / has got). Нажми на него.',
 items:[["The squirrel have got soft brown fur.",'have','has'],["Fish has got shiny scales.",'has','have'],["A flower have got a long stem.",'have','has'],["The birds has got colourful feathers.",'has','have'],["The leaf have got a strong spine.",'have','has'],["We has got a pond in our garden.",'has','have'],["Grandpa have got a big garden.",'have','has']]},
{id:'t5',icon:'📖',title:'Читаем и отвечаем',fmt:'Текст + вопросы',
 intro:'Прочитай (или послушай 🔊) текст про сад и ответь на вопросы. Выбери правильный вариант.',
 memo:"Grandpa has got a small pond in his garden. There are three koi fish in the pond. The fish have got orange fins and shiny scales. Near the pond there is a big tree. A squirrel lives in the tree. It has got soft brown fur. Two birds sit on a branch. They have got blue feathers and small wings. Under the tree the flowers have got pink petals and long green stems.",
 items:[['Who has got a small pond?',['The squirrel','Grandpa','The birds'],1],['How many koi fish are in the pond?',['Two','Four','Three'],2],['What have the fish got?',['Blue feathers and wings','Orange fins and shiny scales','Pink petals and stems'],1],['Where does the squirrel live?',['In the tree','In the pond','Under the flowers'],0],['Has the squirrel got feathers?',['Yes, it has.',"No, it hasn't. It has got fur.",'Yes, it has got wings.'],1],['What have the birds got?',['Soft brown fur','Orange fins','Blue feathers and small wings'],2],['What have the flowers got?',['Fur and wings','Pink petals and long green stems','Scales and fins'],1]]},
{id:'t6',icon:'✍️',title:'Опиши сад сам',fmt:'Пишем свои предложения',
 intro:'Напиши <b>6 предложений</b> о саде дедушки или о других живых существах. Нужны: <b>have got</b>, <b>has got</b> и хотя бы одно отрицание (<b>haven\'t got</b> / <b>hasn\'t got</b>). Каждое предложение — с новой строки или с точкой.'}
];
/* ---------- item tracking ---------- */
function mk(t){const st=I(t.id);const ok=j=>!!(st[j]&&st[j].ok);
 const total=t.items?t.items.length:1;
 const fin=(j,d)=>{if(ok(j))return;st[j]=Object.assign({ok:1},d||{});save();const n=Object.keys(st).filter(k=>/^\d+$/.test(k)&&st[k].ok).length;if(n>=total&&!S.done[t.id]){S.done[t.id]=1;save();drawDots();TASK_DONE(t)}};
 return{st,ok,fin}}
function t1(t,card,m){const ol=list();t.items.forEach(([s,ans,why],j)=>{const it=h('li',{cls:'it'}),fb=h('div',{cls:'fb'});const bs=[true,false].map(v=>h('button',{cls:'op',type:'button',onclick(){if(m.ok(j)||lk(this))return;if(v===ans){m.fin(j,{v});show(v)}else{shake(it);miss();this.classList.add('no');fb.className='fb hint';fb.textContent='Подумай ещё раз и выбери другой ответ.'}}},v?'True':'False'));
 const show=v=>{it.classList.add('done');bs.forEach((b,k)=>{b.disabled=true;if((k===0)===ans)b.classList.add('ok');else b.classList.add('dim');b.classList.remove('no')});fb.className='fb good';fb.innerHTML='✔ '+why;say(s)};
 it.append(h('div',{cls:'q'},h('span',{cls:'num'},j+1),h('span',{},s),sayBtn(s)),h('div',{cls:'opts'},...bs),fb);if(m.ok(j))show(ans);ol.append(it)});card.append(ol)}
function t2(t,card,m){const ol=list();t.items.forEach(([opts,odd,why],j)=>{const it=h('li',{cls:'it'}),fb=h('div',{cls:'fb'});const bs=opts.map(o=>h('button',{cls:'op',type:'button',onclick(){if(m.ok(j)||lk(this))return;if(o===odd){m.fin(j);show()}else{shake(this);miss();this.classList.add('no');fb.className='fb hint';fb.textContent='Это слово подходит к остальным. Ищи лишнее!'}}},o));
 const show=()=>{it.classList.add('done');bs.forEach((b,k)=>{b.disabled=true;b.classList.remove('no');if(opts[k]===odd)b.classList.add('ok');else b.classList.add('dim')});fb.className='fb good';fb.innerHTML='✔ '+why};
 it.append(h('div',{cls:'q'},h('span',{cls:'num'},j+1),h('span',{},'Какое лишнее?')),h('div',{cls:'opts'},...bs),fb);if(m.ok(j))show();ol.append(it)});card.append(ol)}
function shufWord(w){const n=w.length;let p=[...Array(n).keys()];let x=n*131+w.charCodeAt(0);for(let i=n-1;i>0;i--){x=(x*9301+49297)%233280;const k=Math.floor(x/233280*(i+1));[p[i],p[k]]=[p[k],p[i]]}if(p.every((v,i)=>v===i))p=p.slice(1).concat(p[0]);return p}
function t3(t,card,m){const ol=list();t.items.forEach(([w,ru,em],j)=>{const it=h('li',{cls:'it'}),fb=h('div',{cls:'fb'});const order=shufWord(w);let used=[],busy=false;
 const slots=h('div',{cls:'slots'}),tiles=h('div',{cls:'tiles'});
 const draw=()=>{slots.innerHTML='';tiles.innerHTML='';const done=m.ok(j);
  for(let k=0;k<w.length;k++){const li=used[k];slots.append(h('button',{cls:'slot'+(li!=null?' f':'')+(done?' good':''),type:'button','aria-label':'ячейка '+(k+1),onclick(){if(done||busy||li==null)return;used.splice(k,1);draw()}},li!=null?w[li]:''))}
  order.forEach(li=>tiles.append(h('button',{cls:'tile'+(used.includes(li)||done?' used':''),type:'button',disabled:done||used.includes(li)||null,onclick(){if(done||busy||used.includes(li))return;used.push(li);draw();if(used.length===w.length)check()}},w[li])))};
 const check=()=>{const s=used.map(i=>w[i]).join('');if(s===w){m.fin(j,{w});it.classList.add('done');fb.className='fb good';fb.innerHTML='✔ <b>'+w+'</b> — '+ru;say(w);draw()}else{busy=true;shake(slots);miss();fb.className='fb hint';fb.textContent='Не получилось. Подсказка: слово начинается на «'+w[0].toUpperCase()+'». Попробуй ещё раз!';setTimeout(()=>{used=[];busy=false;draw()},800)}};
 it.append(h('div',{cls:'q'},h('span',{cls:'num'},j+1),h('span',{},em+' '+ru),sayBtn(w),h('span',{style:'margin-left:auto;font-size:13px;font-weight:800;color:#2b211a99'},w.length+' букв')),slots,tiles,fb);
 if(m.ok(j)){used=[...Array(w.length).keys()];it.classList.add('done');fb.className='fb good';fb.innerHTML='✔ <b>'+w+'</b> — '+ru}draw();ol.append(it)});card.append(ol)}
function t4(t,card,m){const ol=list();t.items.forEach(([s,bad,fix],j)=>{const it=h('li',{cls:'it'}),fb=h('div',{cls:'fb'});

/* ---- writing checker: have got / has got ---- */
const PL=['i','you','we','they','fish','fins','scales','petals','roots','feathers','wings','birds','flowers','squirrels','leaves','trees','fishes','koi','plants','animals','children','people'];
const PLONLY=PL.filter(x=>x!=='fish'&&x!=='koi');
const SG=['he','she','it','squirrel','bird','flower','leaf','tree','pond','garden','grandpa','grandma','dog','cat','boy','girl','plant','animal','mum','dad','lily','tom'];
const SGPRON=['he','she','it'];
const PLURAL_NOUNS_ART=['wings','petals','roots','fins','scales','feathers'];
function analyse(raw){const s=raw.trim();if(!s)return null;
 if(hasCyr(s)&&!/[a-z]/i.test(s.replace(/[\u0400-\u04FF]/g,'')))return{ok:0,msg:'Пиши по-английски (проверь раскладку клавиатуры).'};
 const w=lat(s).match(/[a-z']+/g)||[];
 if(w.length<4)return{ok:0,msg:'Слишком коротко — напиши целое предложение (4+ слова).'};
 const vi=w.findIndex((x,i)=>(x==='have'||x==='has'||x==="haven't"||x==="hasn't"||x==='havent'||x==='hasnt')&&((w[i+1]==='got')||(w[i+1]==='not'&&w[i+2]==='got')));
 if(vi<0){if(w.includes('have')||w.includes('has')||w.includes("haven't")||w.includes("hasn't"))return{ok:0,msg:'В этом задании нужен вариант с got: have got / has got.'};return{ok:0,msg:'Не вижу have got / has got. Например: Fish have got fins.'}}
 let verb=w[vi];const neg=verb==="haven't"||verb==="hasn't"||verb==='havent'||verb==='hasnt'||w[vi+1]==='not';const isHas=/^has/.test(verb);
 const gi=w[vi+1]==='got'?vi+1:vi+2;const after=w.slice(gi+1);
 if(!after.length)return{ok:0,msg:'Что именно есть? Допиши после got (например: got fins).'};
 const subj=w.slice(0,vi);
 if(!subj.length)return{ok:0,msg:'Добавь, кто это: Fish / The bird / We …'};
 const last=subj[subj.length-1];const hasAnd=subj.includes('and');
 let want=null;
 if(hasAnd)want='have';else if(SGPRON.includes(last))want='has';else if(PLONLY.includes(last))want='have';else if(SG.includes(last))want='has';
 if(want&&want==='have'&&isHas)return{ok:0,msg:'С «'+subj.join(' ')+'» нужно have: '+subj.join(' ')+(neg?" haven't":' have')+' got…'};
 if(want&&want==='has'&&!isHas)return{ok:0,msg:'С «'+subj.join(' ')+'» нужно has: '+subj.join(' ')+(neg?" hasn't":' has')+' got…'};
 for(let i=0;i<after.length-1;i++){if((after[i]==='a'||after[i]==='an')&&PLURAL_NOUNS_ART.includes(after[i+1]))return{ok:0,msg:'«'+after[i]+' '+after[i+1]+'» — после a слово в единственном числе (a wing, a petal).'}}
 return{ok:1,neg,has:isHas,msg:(neg?'Отрицание ':'')+(isHas?'has got':'have got')+' ✔'}}
function t6(t,card,m){const st=m.st;const ta=h('textarea',{id:'story',placeholder:"Fish have got fins and scales.\nThe squirrel has got soft brown fur.\nThe pond hasn't got any flowers.\n…",autocapitalize:'sentences',autocorrect:'off',autocomplete:'off',spellcheck:'false',lang:'en','aria-label':'Твои предложения'});ta.value=st.text||'';
 const res=h('div',{style:'margin-top:10px'}),fb=h('div',{cls:'fb'});
 card.append(h('div',{cls:'memo'},h('b',{},'🗒 Подсказки: '),'слова урока — ',...['fins','scales','petal','stem','roots','soil','feathers','wings','fur','spine'].map(x=>h('span',{cls:'chip'},x)),h('div',{style:'margin-top:6px'},'I / you / we / they / fish / birds / flowers → ',h('b',{},'have got'),' · he / she / it / the squirrel / the leaf → ',h('b',{},'has got'),' · отрицание: ',h('b',{},"haven't got / hasn't got"))));
 const run=final=>{const lines=ta.value.split(/\n|(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);res.innerHTML='';let good=0,neg=0,has=0,hv=0;
  lines.forEach((l,k)=>{const r=analyse(l);if(!r)return;if(r.ok){good++;if(r.neg)neg++;if(r.has)has++;else hv++}res.append(h('div',{cls:'fbl '+(r.ok?'ok':'no')},(r.ok?'✔ ':'✘ ')+(k+1)+'. '+l+' — '+r.msg))});
  if(!final)return;
  const need=[];if(good<6)need.push('принято предложений: '+good+' из 6');if(!neg)need.push('нужно хотя бы одно отрицание (haven\'t got / hasn\'t got)');if(!has)need.push('нужно хотя бы одно предложение с has got');if(!hv)need.push('нужно хотя бы одно предложение с have got');
  if(!need.length){m.fin(0,{});fb.className='fb good';fb.innerHTML='🌻 Отчёт принят! Прочитай свои предложения дедушке (учителю) вслух.'}
  else{if(!m.ok(0))miss();fb.className='fb hint';fb.textContent='Пока не всё: '+need.join(' · ')+'. Исправь строки с ✘.'}};
 ta.addEventListener('input',()=>{st.text=ta.value;save()});
 card.append(ta,h('div',{cls:'bar'},h('button',{cls:'btn sun',type:'button',id:'checkStory',onclick(){if(lk(this,600))return;run(true)}},'🔎 Проверить предложения')),res,fb);
 if(st.text)run(false);if(m.ok(0)){fb.className='fb good';fb.innerHTML='🌻 Отчёт принят!'}}
const RUN={t1,t2,t3,t4,t5,t6};

 card.append(h('div',{cls:'kick'},'Папка '+(i+1)+' из '+T.length+' · '+t.fmt),h('h2',{},t.icon+' '+t.title),h('div',{cls:'intro',html:t.intro}));

 app.append(h('div',{cls:'paper reward'},h('div',{cls:'stamp'},'HOMEWORK SOLVED'),h('div',{cls:'badge'},'🌻'),h('h2',{},'Сад снова ожил!'),
  h('p',{cls:'lead'},'Ты открыл все 6 папок. Дедушка говорит спасибо! Звание: ',h('b',{},rank),' (промахов: '+S.miss+').'),
  h('p',{cls:'lead'},'Кодовое слово для учителя:'),h('div',{cls:'code',id:'codeword'},'FIREFLY'),
  h('p',{cls:'lead'},'🪲 Покажи его на следующем уроке — и не забудь прочитать свои предложения вслух!'),
  h('div',{cls:'bar',style:'justify-content:center'},h('button',{cls:'btn ghost',type:'button',onclick:()=>go('map')},'← К папкам'),h('a',{cls:'btn sun',href:'./'},'К делу «Grandpa\'s Garden»'))));window.scrollTo(0,0)}

muteLabel();drawDots();{const id=location.hash.slice(1);if(id==='reward')reward();else if(T.find(x=>x.id===id))task(T.find(x=>x.id===id));else map()}
